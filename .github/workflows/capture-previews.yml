name: Capture authentic project previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-previews.mjs
      - .github/workflows/capture-previews.yml

permissions:
  contents: write

concurrency:
  group: authentic-project-previews
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live project interfaces
        run: npm run preview:capture -- --all --delay=1400

      - name: Commit refreshed captures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects
          if git diff --cached --quiet; then
            echo "No preview captures changed."
            exit 0
          fi
          git commit -m "Refresh authentic project captures"
          git pull --rebase origin main
          git push origin HEAD:main
