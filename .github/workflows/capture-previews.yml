name: Capture authentic project previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-generated-review.mjs'
      - scripts/capture-previews.mjs
      - .github/workflows/capture-previews.yml

permissions:
  contents: read

concurrency:
  group: authentic-project-previews
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live project interfaces
        run: npm run preview:capture -- --all --delay=1400

      - name: Package generated changes as an owner-reviewable binary patch
        run: node scripts/prepare-generated-review.mjs capture-previews

      - name: Retain complete generated change patch and manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-capture-previews
          path: .cache/generated-review/capture-previews/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
