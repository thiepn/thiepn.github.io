name: Capture authentic project previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-previews.mjs
      - .github/workflows/capture-previews.yml

permissions:
  contents: read

concurrency:
  group: authentic-project-previews
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live project interfaces
        run: npm run preview:capture -- --all --delay=1400

      - name: Prepare generated changes for PR review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          git add public/projects
          node scripts/export-generated-review.mjs

      - name: Upload generated review patch
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-capture-previews
          path: ${{ runner.temp }}/generated-review/
          if-no-files-found: error
          retention-days: 14
