name: Studio redesign verification
on:
  push:
    branches: [redesign/curated-studio-2026-09]
    paths: ['.github/workflows/studio-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/curated-studio-2026-09
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source
        run: |
          python scripts/apply-studio.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md package.json playwright.studio.config.ts scripts src tests
          git commit -m 'feat: replace catalogue-first presentation with curated editorial studio'
          git push origin HEAD:redesign/curated-studio-2026-09
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Source verification
        run: |
          mkdir -p studio-evidence
          npm run catalogue:refresh
          npm run generated:check > studio-evidence/generated.log 2>&1
          npm run validate > studio-evidence/validate.log 2>&1
          npm run typecheck > studio-evidence/typecheck.log 2>&1
          npm test > studio-evidence/unit.log 2>&1
          npm run build > studio-evidence/build.log 2>&1
          npm run perf:budget > studio-evidence/performance.log 2>&1
          npm run perf:scale > studio-evidence/scale.log 2>&1
          npm run test:automation > studio-evidence/automation.log 2>&1
          npm audit --json > studio-evidence/dependency-audit.json || true
          git add src/generated public/catalogue.json public/search-index.json public/sitemap.xml public/og 2>/dev/null || git add src/generated
          if ! git diff --cached --quiet; then git commit -m 'chore: refresh public search and route outputs for studio'; git push origin HEAD:redesign/curated-studio-2026-09; fi
      - name: Browser journey tests
        continue-on-error: true
        run: npm run test:e2e
      - name: Visual and live product verification
        if: always()
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/studio-preview.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node scripts/capture-studio.mjs
          cp /tmp/studio-preview.log studio-evidence/preview.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-verification
          path: |
            studio-evidence/
            test-results/
            playwright-report/
          retention-days: 7
