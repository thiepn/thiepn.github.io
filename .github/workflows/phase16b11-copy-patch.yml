name: Phase 16B-11 homepage identity patch

on:
  push:
    branches: [agent/phase16b11-visible-identity]
    paths:
      - '.github/workflows/phase16b11-copy-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase16b11-home-copy
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/phase16b11-visible-identity
          fetch-depth: 0

      - name: Replace legacy visible identity wording
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Five ways into the THIEPN universe' src/pages/index.astro
          sed -i 's/Five ways into the THIEPN universe/Five ways into the THIEPN portfolio/' src/pages/index.astro
          grep -q 'Five ways into the THIEPN portfolio' src/pages/index.astro
          ! grep -q 'Five ways into the THIEPN universe' src/pages/index.astro

      - name: Commit homepage copy change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git commit -m 'fix: align homepage intent copy with portfolio identity'
          git pull --rebase origin agent/phase16b11-visible-identity
          git push origin HEAD:agent/phase16b11-visible-identity
