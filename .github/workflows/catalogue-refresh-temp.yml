name: Catalogue Refresh Temp

on:
  push:
    branches: [catalogue-refresh-2026-08-22]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: catalogue-refresh-2026-08-22

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh generated catalogue artifacts
        run: npm run catalogue:refresh

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated public/og
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refresh generated catalogue artifacts"
          git push origin HEAD:catalogue-refresh-2026-08-22
