name: P1F refresh generated catalogue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1f-refresh-generated.yml

permissions:
  contents: write

concurrency:
  group: p1f-generated-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Refresh generated catalogue
        run: npm run catalogue:refresh
      - name: Commit generator-owned outputs and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated public/og
          git rm .github/workflows/p1f-refresh-generated.yml
          git commit -m "Refresh P1F generated catalogue"
          git push origin HEAD:main
