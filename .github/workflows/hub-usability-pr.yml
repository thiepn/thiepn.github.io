name: Hub usability PR

on:
  pull_request:
    paths:
      - '.github/workflows/hub-usability-pr.yml'
      - 'src/components/workspace/**'
      - 'src/scripts/workspace-home.ts'
      - 'src/styles/workspace*.css'
      - 'src/lib/workspace/**'
      - 'tests/studio/hub-today-compact.spec.ts'
      - 'tests/studio/hub-navigation-declutter.spec.ts'
      - 'tests/studio/workspace-control-visibility.spec.ts'
      - 'tests/studio/hub-responsive-usability.spec.ts'

permissions:
  contents: read

concurrency:
  group: hub-usability-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accessibility-and-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build isolated PR preview (no deploy)
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Today, navigation and contrast at all sizes/themes
        run: >
          npx playwright test -c playwright.studio.config.ts
          --project chromium --project firefox --project webkit
          --workers=2 --reporter=list
          tests/studio/hub-today-compact.spec.ts
          tests/studio/hub-navigation-declutter.spec.ts
          tests/studio/workspace-control-visibility.spec.ts
          tests/studio/hub-responsive-usability.spec.ts
