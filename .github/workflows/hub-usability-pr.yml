name: Hub usability PR

on:
  pull_request:
    paths:
      - '.github/workflows/hub-usability-pr.yml'
      - 'src/components/workspace/**'
      - 'src/scripts/workspace-home.ts'
      - 'src/styles/workspace*.css'
      - 'src/lib/workspace/**'
      - 'tests/studio/hub-today-compact.spec.ts'
      - 'tests/studio/hub-navigation-declutter.spec.ts'
      - 'tests/studio/workspace-control-visibility.spec.ts'
      - 'tests/studio/hub-responsive-usability.spec.ts'
      - 'tests/studio/hub-foundation.spec.ts'
      - 'tests/studio/hub-workspace-metadata-safety.spec.ts'
      - 'tests/studio/workspace.spec.ts'
      - 'tests/studio/workflow-handoffs.spec.ts'
      - 'tests/studio/hub-sync.spec.ts'

permissions:
  contents: read

concurrency:
  group: hub-usability-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accessibility-and-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build isolated PR preview (no deploy)
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install pinned axe for WCAG checks
        run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - name: Today, navigation and contrast at all sizes/themes
        run: >
          npx playwright test -c playwright.studio.config.ts
          --project chromium --project firefox --project webkit
          --workers=2 --reporter=list
          tests/studio/hub-today-compact.spec.ts
          tests/studio/hub-navigation-declutter.spec.ts
          tests/studio/workspace-control-visibility.spec.ts
          tests/studio/hub-responsive-usability.spec.ts
      - name: Reproduce and qualify full-Quality journey failures
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project chromium --project firefox --project webkit \
            --workers=2 --reporter=list \
            tests/studio/hub-foundation.spec.ts \
            tests/studio/hub-workspace-metadata-safety.spec.ts \
            tests/studio/workspace.spec.ts \
            tests/studio/workflow-handoffs.spec.ts \
            tests/studio/hub-sync.spec.ts \
            --grep 'H1 accessibility /home/|dark-mode planning action contrast|duplicating a workspace copies presentation|H6 Home and Actions discover workflow guides|the rail, presets and named workspaces|fresh tabs reuse the connected session after previous tabs close'
