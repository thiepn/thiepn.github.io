name: Phase 15 Recovery Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'playwright.config.ts'
      - 'playwright.visual.config.ts'
      - '.github/workflows/phase15-recovery.yml'

permissions:
  contents: read

concurrency:
  group: phase15-recovery-certification
  cancel-in-progress: true

jobs:
  production-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generated catalogue freshness
        run: npm run generated:check

      - name: Structural and release-source gates
        run: npm run validate && npm run release:source && npm run a11y:source && npm run visual:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build and budgets
        run: npm run build && npm run perf:budget

      - name: Install Chromium for visual review
        run: npx playwright install --with-deps chromium

      - name: Capture canonical visual states
        run: npm run visual:capture && npm run visual:contact-sheet

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase15-pr3-visual-review
          path: artifacts/visual/**
          if-no-files-found: error

      - name: Install remaining certification browsers
        run: npx playwright install --with-deps firefox webkit

      - name: Cross-browser production certification
        run: npm run test:e2e:release
