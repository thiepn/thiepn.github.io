name: M04 final six-app and Byte immutable download verification
on:
  push:
    branches: [release-standard/m04-six-final-20261121]
    paths: ['.github/workflows/m04-final-readonly.yml']
permissions:
  contents: read
concurrency:
  group: thiepn-m04-final-readonly
  cancel-in-progress: true
jobs:
  certified-download-and-web-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Verify original Byte v0.1.0 checksums, immutable mirror and security properties
        env:
          REQUIRE_RELEASE_POINTER: '1'
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,io,json,os,struct,urllib.error,urllib.request,zipfile
          expected={
            'v0.1.0/Byte-v0.1.0-windows-x64-setup.exe':(1722430,'effef85d352a283634433e22ecc80b7e5440e11a18e5e84002fb103bd5f0526e'),
            'v0.1.0/Byte-v0.1.0-windows-x64-portable.zip':(2338668,'febfb550c44d9f40112e97c06b0921abd60a54ba881dda8ec995266510834386'),
            'v0.1.0/release-manifest.json':(385,'eff52a11792c704bbeaaaaadd0aba1887af4cb68706ae38daf81ff5948fe9bd3'),
            'v0.1.0/release-certification.json':(1253,'d110a21e22794faa9dff3c5ceae46ae4feefc060ea77a4f08485b6e7b1e352c3'),
            'v0.1.0/SHA256SUMS.txt':(388,'b46fe6679b64048df2d762f005c2a74b9a9ca79e07bd29ed268d6b2c5accde90'),
            'previews/byte/preview.png':(616,'37edce35826c63eab9b5880ed55aa243f34e729a3f26fcd93d5cf95e370e924c'),
            'previews/kiwi/preview.png':(696,'bd549031d6066ca1c526156d32f08394e935c201bd176b770fd70046481bf15c'),
            'previews/mochi/preview.png':(743,'46a07b753e0ac17f49a2424cd1f07f4dff78421747a67138b4ae1bd5cd8f8bca'),
            'previews/pip/preview.png':(562,'85f44f367cb8b2d5e909499ee8e6399dfcb8728c5e6394e96679b768c0876571')}
          live='https://thiepn.dev/byte/download/'
          frozen='https://c2905f6f.thiepn-byte-v010-recovery.pages.dev/byte/download/'
          def request(url,method='GET',additional=None):
              req=urllib.request.Request(url,method=method,headers={'User-Agent':'Mozilla/5.0','Accept-Encoding':'identity','Cache-Control':'no-cache',**(additional or {})})
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      return r.status,r.geturl(),r.headers,r.read(2500000)
              except urllib.error.HTTPError as e:
                  return e.code,e.geturl(),e.headers,e.read(10000)
          def proof(pair):
              path,(size,checksum)=pair
              for base in [live,frozen]:
                  status,url,h,b=request(base+path)
                  assert status==200 and url==base+path,(path,base,status,url)
                  assert len(b)==size and hashlib.sha256(b).hexdigest()==checksum,('BYTE_HASH',path,base,len(b),hashlib.sha256(b).hexdigest(),checksum, h.get('Content-Type'),h.get('CF-Cache-Status'))
                  if base==live:
                      assert h.get('X-THIEPN-Byte-Release')=='0.1.0',('Byte release',path)
                      assert h.get('X-Content-Type-Options')=='nosniff',('nosniff',path)
                      if os.environ.get('REQUIRE_RELEASE_POINTER')=='1':
                          assert h.get('X-THIEPN-Release-Manifest')=='eff52a11792c704bbeaaaaadd0aba1887af4cb68706ae38daf81ff5948fe9bd3',('Release pointer',path)
                      if path.endswith(('.exe','.zip')):
                          name=path.rsplit('/',1)[-1]
                          assert h.get('Content-Disposition')=='attachment; filename="'+name+'"',('unsafe download',path,h.get('Content-Disposition'))
                          assert h.get('Referrer-Policy')=='no-referrer',('referrer',path)
                          assert h.get('Content-Type') in ['application/octet-stream','application/zip'],('mime',path,h.get('Content-Type'))
                          code,_,head,_=request(base+path,'HEAD')
                          assert code==200 and head.get('Content-Disposition')==h.get('Content-Disposition'),('HEAD',path)
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              verified=list(pool.map(proof,expected.items()))
          assert len(verified)==9
          print('PASS: all nine original Byte public assets SHA-256 equal in live and immutable origins')
          status,url,headers,installer=request(live+'v0.1.0/Byte-v0.1.0-windows-x64-setup.exe')
          assert installer[:2]==b'MZ' and len(installer)==1722430,('Installer is not a PE')
          offset=struct.unpack_from('<I',installer,0x3c)[0]
          assert installer[offset:offset+4]==bytes.fromhex('50450000') and struct.unpack_from('<H',installer,offset+4)[0] in (0x14c,0x8664),'NSIS installer stub machine invalid'
          _,_,_,portable=request(live+'v0.1.0/Byte-v0.1.0-windows-x64-portable.zip')
          with zipfile.ZipFile(io.BytesIO(portable)) as z:
              members=z.namelist()
              binary=[s for s in members if s.lower().endswith('byte.exe')]
              assert len(binary)==1,('Expected one Byte.exe',members)
              data=z.read(binary[0])
              off=struct.unpack_from('<I',data,0x3c)[0]
              assert data[:2]==b'MZ' and data[off:off+4]==bytes.fromhex('50450000') and struct.unpack_from('<H',data,off+4)[0]==0x8664,'Portable binary must be x64 PE'
          _,_,_,manifest=request(live+'v0.1.0/release-manifest.json')
          _,_,_,cert=request(live+'v0.1.0/release-certification.json')
          m=json.loads(manifest);c=json.loads(cert)
          assert m['version']=='0.1.0' and m['signed'] is False and m['downgrades_allowed'] is False and m['installer_scope']=='currentUser'
          assert c['version']=='0.1.0' and c['commit']==m['commit']=='59e80ff24647fbc805b8c1607a89dcba25f2f7ed'
          assert c['checks']['app_data_preservation'] is True and c['checks']['portable_launch'] is True and c['signed'] is False
          assert c['checks']['previous_release_upgrade'] is False and c['checks']['downgrade_policy_runtime'] is False
          _,_,_,sums=request(live+'v0.1.0/SHA256SUMS.txt')
          for rel,(size,h) in expected.items():
              if rel.startswith('v0.1.0/') and not rel.endswith('SHA256SUMS.txt'):
                  assert (h+'  '+rel.split('/')[-1]).encode() in sums,('SHA file drift',rel)
          print('PASS: certified historical Windows x64 installer/portable identity, release metadata, true unsigned limitations, data-preservation certificate')
          code,url,_,landing=request('https://thiepn.dev/byte/')
          assert code==200 and b'Byte' in landing
          for rel in ['Byte-v0.1.0-windows-x64-setup.exe','Byte-v0.1.0-windows-x64-portable.zip']:
              assert ('href="/byte/download/v0.1.0/'+rel+'"').encode() in landing,('broken public landing link',rel)
          for label in ['byte','kiwi','mochi','pip']:
              assert ('src="/byte/download/previews/'+label+'/preview.png"').encode() in landing,('broken preview',label)
          assert b'github.com/thiepn/byte/releases/download/' not in landing
          code,url,_,historical=request(live+'v0.1.0/')
          assert code==200 and b'This historical release is unsigned' in historical
          code,_,_,_=request(live+'private-source.txt')
          assert code==404,'Private path exposed'
          code,url,_,_=request('https://thiepn.dev/byte?m04=1')
          assert code==200 and url=='https://thiepn.dev/byte/?m04=1','Broken canonical redirect'
          code,_,_,_=request(live+'v0.1.0/Byte-v0.1.0-windows-x64-setup.exe','POST')
          assert code==405,'Download POST unexpectedly accepted'
          print('PASS: stable URLs, private allowlist, no source leak, installer download headers, historical unsigned warning and landing previews')
          PY
      - name: Diagnose exact Byte historic release HTML delivery and Cloudflare transformations
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json
          targets=[
            'https://thiepn.dev/byte/download/v0.1.0/',
            'https://thiepn.dev/byte/download/v0.1.0/index.html',
            'https://c2905f6f.thiepn-byte-v010-recovery.pages.dev/byte/download/v0.1.0/',
            'https://c2905f6f.thiepn-byte-v010-recovery.pages.dev/byte/download/v0.1.0/index.html']
          for url in targets:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Accept-Encoding':'identity'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      b=response.read(100000)
                      digest=hashlib.sha256(b).hexdigest()
                      if url.endswith('/v0.1.0/'):
                          assert len(b)==1696 and digest=='dbc908cdd6f4d5a28b9d534ff56672ae8f58934c8572795faaa23d859484f679',('UNVERIFIED_RELEASE_HTML',url,len(b),digest)
                          if url.startswith('https://thiepn.dev/'):
                              assert response.headers.get('X-THIEPN-Release-Manifest')=='eff52a11792c704bbeaaaaadd0aba1887af4cb68706ae38daf81ff5948fe9bd3',('UNVERIFIED_BYTE_POINTER',url)
                      print(json.dumps({'requested':url,'final':response.geturl(),'status':response.status,'bytes':len(b),'sha256':digest,'releaseHeader':response.headers.get('X-THIEPN-Byte-Release'),'hasCloudflareBeacon':b'beacon.min.js' in b}))
              except Exception as error:
                  print(json.dumps({'requested':url,'exception':str(error)}))
          PY
      - name: Cross-check all six canonical application URLs against pinned release content
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          expected={
            'manuscript':(3585004,'0b4b0f7e169520009319fc3dd48a0a9f7e444b928f1432d1502e5ccaeca6da1f'),
            'notes':(1818,'d96858668b1dfb95236d8078ff8c754fe3f387e6fa6823c102de6d8951a43850'),
            'vault':(604,'870aeb477cb7d31db38da972999a197a51e9e80d3ebc4c3712d748713656b445'),
            'pdf':(3127,'aa1ce8c3c0d6eac1636c8098d0f9956b30113bebaf2b0bc1a77012d8124372fc'),
            'diet':(58021,'d87f317789d96fd8ec594ef90a79e25e10fce3888edcab1bb6c5a62c32afa7d5')}
          for app,(size,digest) in expected.items():
              url='https://thiepn.dev/'+app+'/'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  body=response.read(size+1)
                  assert response.status==200 and response.geturl()==url,(app,'routing',response.geturl())
                  assert len(body)==size and hashlib.sha256(body).hexdigest()==digest,(app,'runtime changed',len(body),hashlib.sha256(body).hexdigest())
              print('PASS',app,'certified app HTML exact')
          req=urllib.request.Request('https://thiepn.dev/byte/',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200 and 'Byte' in r.read(300000).decode('utf-8')
          req=urllib.request.Request('https://thiepn-diet.vercel.app/api/health',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              import json
              j=json.load(r)
              assert j.get('ok') is True and j.get('ready') is True and j.get('runtime')=='vercel','Diet backend not ready'
          print('PASS: all six original app URLs, five exact app HTML fingerprints and Diet independent backend readiness')
          PY
  disposable-browser-pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser only, no private source or credentials
        run: |
          npm install --prefix /tmp/m04-browser playwright@1.58.2 --ignore-scripts --no-package-lock --no-audit --no-fund
          if command -v google-chrome >/dev/null; then
            echo "M04_CHROME=chrome" >> "$GITHUB_ENV"
          else
            npx --prefix /tmp/m04-browser playwright install --with-deps chromium
          fi
      - name: Smoke all five installed web apps and the Byte download page with disposable browsers
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '/tmp/m04-browser/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch(process.env.M04_CHROME?{channel:process.env.M04_CHROME}:{});
          const apps=[['manuscript','Manuscript'],['notes','Notes'],['vault','Vault'],['pdf','PDF Studio'],['diet','Diet Copilot']];
          try{
            for(const [app,title] of apps){
              const context=await browser.newContext({serviceWorkers:'allow'});
              try{
                const page=await context.newPage();
                const url='https://thiepn.dev/'+app+'/';
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                assert.equal(response.status(),200,app);
                assert((await page.title()).includes(title),app+' title '+await page.title());
                await page.evaluate(async()=>{await navigator.serviceWorker.ready});
                if(!(await page.evaluate(()=>navigator.serviceWorker.controller!==null)))await page.reload({waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>navigator.serviceWorker.controller!==null,{timeout:25000});
                await context.setOffline(true);
                await page.reload({waitUntil:'domcontentloaded',timeout:25000});
                assert((await page.title()).includes(title),app+' offline title');
                await context.setOffline(false);
                console.log('PASS',app,'original URL, SW scope and offline shell');
              } finally {await context.close()}
            }
            const context=await browser.newContext();
            try{
              const page=await context.newPage();
              const r=await page.goto('https://thiepn.dev/byte/',{waitUntil:'domcontentloaded',timeout:20000});
              assert.equal(r.status(),200);
              for(const file of ['Byte-v0.1.0-windows-x64-setup.exe','Byte-v0.1.0-windows-x64-portable.zip']){
                assert((await page.locator('a[href="/byte/download/v0.1.0/'+file+'"]').count())>=1,file+' landing: '+JSON.stringify(await page.locator('a').evaluateAll(xs=>xs.map(a=>({text:a.textContent?.trim().slice(0,45),href:a.getAttribute('href')})).filter(x=>x.href?.includes('Byte-')||x.href?.includes('v0.1.0')))));
              }
              console.log('PASS Byte public download page and original installer/portable links');
            }finally{await context.close()}
          }finally{await browser.close()}
          JS
