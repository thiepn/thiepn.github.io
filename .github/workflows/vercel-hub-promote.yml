name: Promote certified THIEPN Hub Vercel deployment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA used for the candidate
        required: true
        type: string
      deployment_url:
        description: Certified Vercel candidate URL
        required: true
        type: string
      confirm:
        description: Type PROMOTE thiepn-hub
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-hub-production-control
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: thiepn-hub
      VERCEL_ENV_TARGET: production
    steps:
      - name: Validate dispatch fields before checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]]
          [[ "$CONFIRM" == "PROMOTE thiepn-hub" ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate immutable release input
        run: >-
          node scripts/vercel/release-control.mjs validate-input
          --action promote --sha "${{ inputs.source_sha }}"
          --url "${{ inputs.deployment_url }}"
          --confirm "${{ inputs.confirm }}"
      - run: test -n "$VERCEL_TOKEN"
      - run: npm run vercel:standard
      - name: Source qualification
        run: |
          npm run release:lockfile
          npm run generated:check
          npm run validate
          npm run typecheck
          npm test
          npm run release:source
      - name: Bootstrap/reconcile project and CLI linkage
        id: provision
        run: npm run vercel:bootstrap
      - name: Audit Production environment metadata
        env:
          VERCEL_PROJECT_ID: ${{ steps.provision.outputs.project-id }}
        run: npm run vercel:env-audit
      - name: Rebuild comparison artifact with Production settings
        run: |
          npx --yes vercel@50.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@50.1.0 build --prod --token="$VERCEL_TOKEN"
          node --experimental-strip-types scripts/qualify-hub-release.mjs --dist .vercel/output/static
      - name: Create ephemeral deployment-protection bypass for CI verification
        id: bypass
        run: npm run vercel:bypass-create
      - name: Wait for deployment-protection bypass activation
        run: npm run vercel:bypass-wait -- --url "${{ inputs.deployment_url }}"

      - name: Prove supplied deployment matches certified source
        run: |
          node --experimental-strip-types scripts/smoke-hub-release.mjs --url "${{ inputs.deployment_url }}"
          npm run vercel:candidate-smoke -- --url "${{ inputs.deployment_url }}"
          npx --yes vercel@50.1.0 inspect "${{ inputs.deployment_url }}" --token="$VERCEL_TOKEN"
      - name: Promote exact existing deployment
        run: >-
          npx --yes vercel@50.1.0 promote "${{ inputs.deployment_url }}"
          --yes --timeout 5m --token="$VERCEL_TOKEN"
      - name: Verify promotion status
        run: npx --yes vercel@50.1.0 promote status "${{ steps.provision.outputs.project-name }}" --token="$VERCEL_TOKEN"
      - name: Record promotion evidence
        run: >-
          node scripts/vercel/release-control.mjs record
          --action promote --sha "${{ inputs.source_sha }}"
          --url "${{ inputs.deployment_url }}"
          --project-id "${{ steps.provision.outputs.project-id }}"
          --project-name "${{ steps.provision.outputs.project-name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-hub-promotion-${{ inputs.source_sha }}
          path: |
            .cache/hub-release-qualification.json
            .cache/vercel-release-record.json
          retention-days: 90
      - name: Revoke ephemeral deployment-protection bypass
        if: ${{ always() && steps.bypass.outcome == 'success' }}
        run: npm run vercel:bypass-revoke
