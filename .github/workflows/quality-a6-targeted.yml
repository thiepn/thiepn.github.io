name: A6 isolated Quality privacy and Firefox layout triage
on:
  push:
    branches: [diagnostic/workspace-restricted-a4]
    paths:
      - 'tests/studio/hub-sync.spec.ts'
      - 'tests/studio/workspace-a6-firefox.spec.ts'
      - 'tests/studio/workspace.spec.ts'
      - '.github/workflows/quality-a6-targeted.yml'
  pull_request:
    paths:
      - 'tests/studio/hub-sync.spec.ts'
      - 'tests/studio/workspace-a6-firefox.spec.ts'
      - 'tests/studio/workspace.spec.ts'
      - '.github/workflows/quality-a6-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-a6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a6:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.61.1
    timeout-minutes: 20
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify all three browser engines
        run: |
          node --input-type=module -e "import{chromium,firefox,webkit}from'playwright';for(const [n,b]of [['chromium',chromium],['firefox',firefox],['webkit',webkit]]){const x=await b.launch({headless:true});await x.close();console.log(n+' launched');}"
      - name: Cross-tab authoritative owner transition and A5 privacy controls
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=firefox --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'an account change from another tab saves pending capture|A5 ' \
            --workers=1 --reporter=line
      - name: Firefox original drag and stable-ID diagnostic (nonblocking classification)
        if: always()
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=firefox \
            tests/studio/workspace.spec.ts tests/studio/workspace-a6-firefox.spec.ts \
            -g 'pointer drag and resize commit logical placement that survives reflow|A6 Firefox stable widget ID' \
            --repeat-each=3 --workers=1 --reporter=line
      - name: Collect any failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-a6-test-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
