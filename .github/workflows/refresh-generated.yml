name: Refresh generated catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-generated.yml'
      - 'src/content/**'
      - 'src/data/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/rasterize-og.mjs'
      - 'scripts/refresh-catalogue.mjs'
      - 'scripts/lib/catalogue-files.mjs'

permissions:
  contents: read

concurrency:
  group: refresh-generated-catalogue
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for OG rasterization
        run: npx playwright install --with-deps chromium

      - name: Refresh generated catalogue artifacts
        run: |
          node scripts/rasterize-og.mjs
          npm run catalogue:refresh

      - name: Prepare generated changes for PR review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          git add src/generated public/og
          node scripts/export-generated-review.mjs

      - name: Upload generated review patch
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-refresh-generated
          path: ${{ runner.temp }}/generated-review/
          if-no-files-found: error
          retention-days: 14
