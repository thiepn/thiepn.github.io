name: Refresh generated catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-generated.yml'
      - 'src/content/**'
      - 'src/data/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/refresh-catalogue.mjs'
      - 'scripts/lib/catalogue-files.mjs'

permissions:
  contents: write

concurrency:
  group: refresh-generated-catalogue
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh generated catalogue artifacts
        run: npm run catalogue:refresh

      - name: Commit refreshed generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated public/og
          if git diff --cached --quiet; then
            echo "Generated catalogue artifacts are already current."
            exit 0
          fi
          git commit -m "Refresh generated catalogue artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
