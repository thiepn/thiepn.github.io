name: Refresh generated catalogue

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-generated-review.mjs'
      - '.github/workflows/refresh-generated.yml'
      - 'src/content/**'
      - 'src/data/**'
      - 'scripts/generate-*.mjs'
      - 'scripts/rasterize-og.mjs'
      - 'scripts/refresh-catalogue.mjs'
      - 'scripts/lib/catalogue-files.mjs'

permissions:
  contents: read

concurrency:
  group: refresh-generated-catalogue
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for OG rasterization
        run: npx playwright install --with-deps chromium

      - name: Refresh generated catalogue artifacts
        run: |
          node scripts/rasterize-og.mjs
          npm run catalogue:refresh

      - name: Package generated changes as an owner-reviewable binary patch
        run: node scripts/prepare-generated-review.mjs refresh-generated

      - name: Retain complete generated change patch and manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-refresh-generated
          path: .cache/generated-review/refresh-generated/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
