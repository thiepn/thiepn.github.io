name: P3 One-Time Vercel Hub Bootstrap

on:
  push:
    branches: [vercel-p3-hub-foundation]

permissions:
  contents: read

concurrency:
  group: p3-vercel-hub-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: thiepn-hub
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLIC_HUB_ACCOUNT_ENTRY: ${{ vars.HUB_ACCOUNT_ENTRY }}
      PUBLIC_HUB_AUTH_ORIGIN: https://thiepn.dev
      PUBLIC_THIEPN_SUPABASE_URL: https://hycegznamzjhwinegaai.supabase.co
      PUBLIC_THIEPN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.THIEPN_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ''
    steps:
      - uses: actions/checkout@v7

      - name: Detect Vercel deployment credential
        id: credential
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; P3 bootstrap stops before Vercel state."
          fi

      - uses: actions/setup-node@v6
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.credential.outputs.available == 'true'
        run: npm ci --no-audit --no-fund

      - name: Provision manual-only project
        if: steps.credential.outputs.available == 'true'
        id: provision
        run: node scripts/provision-vercel-hub.mjs

      - name: Pull Preview settings
        if: steps.credential.outputs.available == 'true'
        run: >-
          npx --yes vercel@50.1.0 pull
          --yes
          --environment=preview
          --project="${{ steps.provision.outputs.project-id }}"
          --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        if: steps.credential.outputs.available == 'true'
        run: >-
          npx --yes vercel@50.1.0 build
          --project="${{ steps.provision.outputs.project-id }}"
          --token="$VERCEL_TOKEN"

      - name: Qualify exact Vercel output
        if: steps.credential.outputs.available == 'true'
        run: >-
          node --experimental-strip-types
          scripts/qualify-hub-release.mjs
          --dist .vercel/output/static

      - name: Deploy Preview
        if: steps.credential.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(
            npx --yes vercel@50.1.0 deploy \
              --prebuilt \
              --yes \
              --project="${{ steps.provision.outputs.project-id }}" \
              --token="$VERCEL_TOKEN" |
            tail -n 1
          )"
          [[ "$url" == https://* ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Exact served-artifact smoke
        if: steps.credential.outputs.available == 'true'
        run: >-
          node --experimental-strip-types
          scripts/smoke-hub-release.mjs
          --url "${{ steps.deploy.outputs.url }}"

      - name: Vercel hosting smoke
        if: steps.credential.outputs.available == 'true'
        run: >-
          node scripts/smoke-vercel-preview.mjs
          --url "${{ steps.deploy.outputs.url }}"
