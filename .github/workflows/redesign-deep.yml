name: Redesign deep evidence
on:
  push:
    branches: [redesign/curated-studio-2026-09]
    paths: ['.github/workflows/redesign-deep.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --prefix /tmp/audit-tools axe-core
      - run: npx playwright install --with-deps chromium
      - name: Inspect
        run: |
          mkdir -p evidence
          cp /tmp/audit-tools/node_modules/axe-core/axe.min.js evidence/
          cat > capture-deep.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser=await chromium.launch();const results=[];const origin='https://thiepn.dev';
          const c=await browser.newContext();const p=await c.newPage();const discovered=[];
          for(const path of ['/projects/','/collections/']){await p.goto(origin+path);discovered.push(...await p.locator('a[href]').evaluateAll(es=>es.map(e=>e.href).filter(u=>/thiepn.dev\/(project|collection)\//.test(u))));}await c.close();
          async function capture(url,name,width=1440,scheme='light',scroll=true,axe=false,wait=1800){
            const ctx=await browser.newContext({viewport:{width,height:900},colorScheme:scheme,ignoreHTTPSErrors:true});const page=await ctx.newPage();const row={url,name,width,scheme,errors:[]};page.on('pageerror',e=>row.errors.push(e.message));
            try{
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});row.status=response?.status();await page.waitForTimeout(wait);
              row.initial=await page.evaluate(()=>({headings:[...document.querySelectorAll('h1,h2,h3')].map(e=>({text:e.textContent,y:e.getBoundingClientRect().y})),width:document.documentElement.scrollWidth,fonts:getComputedStyle(document.body).fontFamily,requests:performance.getEntriesByType('resource').map(r=>({name:r.name,transfer:r.transferSize,duration:r.duration})),title:document.title}));
              await page.screenshot({path:'evidence/'+name+'-viewport.png',timeout:10000});
              if(scroll){await page.evaluate(async()=>{for(let y=0;y<Math.min(document.documentElement.scrollHeight,18000);y+=650){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,90));}window.scrollTo(0,0)});await page.waitForTimeout(300);}
              row.text=(await page.locator('body').innerText()).slice(0,70000);row.links=await page.locator('a[href]').evaluateAll(es=>es.map(e=>({text:e.innerText,href:e.href})));
              row.controls=await page.locator('button,input,select').evaluateAll(es=>es.map(e=>({tag:e.tagName,text:e.innerText,placeholder:e.getAttribute('placeholder'),aria:e.getAttribute('aria-label')})));
              row.images=await page.locator('img').evaluateAll(es=>es.map(e=>({src:e.currentSrc,alt:e.alt,loaded:e.complete&&e.naturalWidth>0})));
              if(scroll)await page.screenshot({path:'evidence/'+name+'-full.png',fullPage:true,timeout:10000});
              if(axe){await page.addScriptTag({path:'evidence/axe.min.js'});row.axe=await page.evaluate(async()=>await window.axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}}));}
              fs.writeFileSync('evidence/'+name+'.html',await page.content());
              if(url===origin+'/'&&width===375){await page.getByRole('button',{name:'Menu',exact:true}).click();await page.screenshot({path:'evidence/menu-open.png'});await page.keyboard.press('Escape');row.menuEsc=!(await page.locator('[data-mobile-menu-dialog]').isVisible());}
              if(url===origin+'/'&&width===1440){await page.keyboard.press('Tab');row.firstFocus=await page.evaluate(()=>document.activeElement?.textContent);await page.keyboard.press('Control+k');await page.waitForTimeout(500);const input=page.locator('[data-catalogue-search-input]');await input.fill('pdf');await page.waitForTimeout(400);await page.screenshot({path:'evidence/search-result.png'});row.search=await page.locator('[data-catalogue-search-dialog]').innerText();await input.fill('zzzzzunlikely');await page.waitForTimeout(300);await page.screenshot({path:'evidence/search-empty.png'});await page.keyboard.press('Escape');row.searchEsc=!(await page.locator('[data-catalogue-search-dialog]').isVisible());}
            }catch(e){row.error=e.message;}results.push(row);fs.writeFileSync('evidence/deep-summary.json',JSON.stringify(results,null,2));await ctx.close();
          }
          for(const path of ['/','/projects/','/collections/','/about/','/books/','/library/'])await capture(origin+path,'live-'+(path.replaceAll('/','')||'home'),1440,'light',true,true);
          for(const url of [...new Set(discovered)])await capture(url,'live-'+new URL(url).pathname.replaceAll('/','-'));
          for(const path of ['/','/projects/','/project/micro-arcade/','/project/pdf-studio/','/project/manuscript/','/collection/browser-games/'])await capture(origin+path,'mobile-'+path.replaceAll('/','-'),375,'light',true,true);
          for(const path of ['/project/micro-arcade/','/project/pdf-studio/'])await capture(origin+path,'dark-'+path.replaceAll('/','-'),1440,'dark',true,true);
          for(const app of ['arcade','wordstrike','tbc','pdf','manuscript','mathlab','unreached','library'])await capture(origin+'/'+app+'/','app-'+app,1440,'light',false,false,4000);
          for(const [name,url] of [['linear','https://linear.app/'],['raycast','https://www.raycast.com/'],['lusion','https://lusion.co/'],['resn','https://resn.co.nz/'],['bruno','https://bruno-simon.com/'],['stripepress','https://press.stripe.com/']])await capture(url,'ref-ready-'+name,1440,'light',false,false,12000);
          await browser.close();
          JS
          node capture-deep.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-deep
          path: evidence/
          retention-days: 7
