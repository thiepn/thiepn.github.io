name: Verify suite positioning
on:
  push:
    branches: [fix/tiny-tools-suite-positioning]
    paths: ['.github/workflows/toolbox-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiny-tools-suite-positioning
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Apply suite presentation and capture the actual toolbox
        run: |
          mkdir -p toolbox-qa
          python scripts/reframe-toolbox.py
          node --input-type=module - <<'JS'
          import {chromium} from '@playwright/test';
          import sharp from 'sharp';
          import fs from 'node:fs';
          const browser=await chromium.launch();const page=await browser.newPage({viewport:{width:1440,height:1000},colorScheme:'light'});
          await page.goto('https://thiepn.dev/tools/',{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);
          const bytes=await page.screenshot();
          await sharp(bytes).webp({quality:88}).toFile('public/projects/tiny-tools/showcase-suite.webp');
          fs.writeFileSync('docs/showcase/suite-provenance.json',JSON.stringify({url:page.url(),capturedAt:new Date().toISOString(),source:'/projects/tiny-tools/showcase-suite.webp',treatment:'Unaltered initial viewport, encoded as WebP',observedTitle:await page.title()},null,2)+'\n');
          await browser.close();
          JS
          node scripts/rasterize-og.mjs > toolbox-qa/og.log 2>&1
          npm run catalogue:refresh > toolbox-qa/refresh.log 2>&1
          rm scripts/reframe-toolbox.py .github/workflows/toolbox-evidence.yml .github/workflows/toolbox-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts docs/showcase public/og public/projects/tiny-tools .github/workflows
          git commit -m 'fix: present Tiny Tools as the complete suite, not a text cleaner'
          git push origin HEAD:fix/tiny-tools-suite-positioning
          git rev-parse HEAD > toolbox-qa/source-sha.txt
      - name: Maintained quality suite
        run: npm run audit:studio > toolbox-qa/quality.log 2>&1
      - name: Scale and automation
        run: npm run perf:scale && npm run test:automation
      - name: Browser views and live route destinations
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node scripts/verify-toolbox-suite.mjs
          node scripts/capture-showcase-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-suite-verification
          path: |
            toolbox-qa/
            showcase-qa/
            test-results/
            playwright-report/
          retention-days: 7
