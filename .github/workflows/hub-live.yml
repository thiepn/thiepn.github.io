name: Hub live rollout
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hub-live-rollout
  cancel-in-progress: false
jobs:
  public-rollout:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Recheck exact deployed build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: hub-release-qualification
          path: .cache
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - if: github.event_name == 'workflow_run'
        run: npm run hub:smoke
      - name: Live public flows and tokenless Account entry (no Google sign-in)
        run: npx playwright test -c playwright.hub-live.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-live-rollout
          path: test-results/
          retention-days: 7
