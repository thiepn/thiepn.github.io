name: Studio transfer integrity
on:
  push:
    branches: [redesign/curated-studio-2026-09]
    paths: ['.github/workflows/studio-transfer.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: studio-transfer
          path: scripts/studio-transfer-*.txt
          retention-days: 3
