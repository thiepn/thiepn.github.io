name: Showcase final assets
on:
  push:
    branches: [design/showcase-tiny-tools]
    paths: ['.github/workflows/showcase-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/showcase-tiny-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm install --prefix /tmp/lighthouse-tools lighthouse@13.4.1
      - name: Generate authentic social cards and validate source
        run: |
          mkdir -p final-assets-evidence
          node scripts/rasterize-og.mjs > final-assets-evidence/og.log 2>&1
          npm run catalogue:refresh
          npm run generated:check
          npm run validate
          npm run typecheck > final-assets-evidence/typecheck.log 2>&1
          npm test > final-assets-evidence/unit.log 2>&1
          npm run build > final-assets-evidence/build.log 2>&1
          npm run perf:budget > final-assets-evidence/performance.log 2>&1
          npm run test:automation > final-assets-evidence/automation.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/og src/generated
          if ! git diff --cached --quiet; then git commit -m 'feat: align project sharing cards with the real work'; git push origin HEAD:design/showcase-tiny-tools; fi
          git rev-parse HEAD > final-assets-evidence/tested-sha.txt
          cp public/og/{index,tiny-tools,manuscript,micro-arcade,pdf-studio}.png final-assets-evidence/
      - name: Recheck semantic fix in Lighthouse
        run: |
          mkdir -p dist/library/media/works/choosing-a-mission-organization dist/library/media/works/how-to-love-god/editions/1.1.0
          curl --fail --retry 2 https://thiepn.dev/library/media/works/choosing-a-mission-organization/cover.svg -o dist/library/media/works/choosing-a-mission-organization/cover.svg
          curl --fail --retry 2 https://thiepn.dev/library/media/works/how-to-love-god/editions/1.1.0/how-to-love-god.webp -o dist/library/media/works/how-to-love-god/editions/1.1.0/how-to-love-god.webp
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node /tmp/lighthouse-tools/node_modules/lighthouse/cli/index.js http://127.0.0.1:4321/ --chrome-flags='--headless --no-sandbox' --output=json --output-path=final-assets-evidence/home-mobile.json --quiet
          node /tmp/lighthouse-tools/node_modules/lighthouse/cli/index.js http://127.0.0.1:4321/ --preset=desktop --chrome-flags='--headless --no-sandbox' --output=json --output-path=final-assets-evidence/home-desktop.json --quiet
          node --input-type=module -e "import fs from 'node:fs'; for(const name of ['home-mobile','home-desktop']){const r=JSON.parse(fs.readFileSync('final-assets-evidence/'+name+'.json')); if(r.audits['agent-accessibility-tree'].score!==1)throw new Error('Accessibility tree failure: '+name);console.log(name,Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score]))); }"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-final-assets
          path: final-assets-evidence/
          retention-days: 7
