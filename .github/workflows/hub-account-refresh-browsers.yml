name: Hub Account rotating-refresh browsers

on:
  pull_request:
    paths:
      - 'tests/studio/hub-sync.spec.ts'
      - 'src/lib/hub-account-persistence.ts'
      - 'src/lib/hub-account-storage.ts'
      - 'vendor/account-session/**'
      - '.github/workflows/hub-account-refresh-browsers.yml'

permissions:
  contents: read

concurrency:
  group: hub-account-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  account-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Original Account types, source and browser build
        run: |
          npm run typecheck
          npm run build
      - name: Install Chromium, Firefox and WebKit with native dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Original Account storage and identity unit tests
        run: npx vitest run tests/unit/hub-account-storage.test.ts tests/unit/hub-account.test.ts
      - name: Repeat real Firefox, Chromium and WebKit no-Web-Locks refresh
        run: npx playwright test -c playwright.studio.config.ts --project=chromium --project=firefox --project=webkit tests/studio/hub-sync.spec.ts --grep "concurrent new tabs share one rotating refresh even without Web Locks" --repeat-each=10
      - name: Original complete Account and cross-device sync browser coverage
        run: npx playwright test -c playwright.studio.config.ts --project=chromium --project=firefox --project=webkit tests/studio/hub-sync.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account-refresh-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
