name: P6 one-shot certified Vercel candidate

on:
  push:
    branches:
      - vercel-p6-bootstrap-candidate
    paths:
      - .p6-candidate-trigger

permissions:
  contents: read

concurrency:
  group: p6-one-shot-certified-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: thiepn-hub
      VERCEL_ENV_TARGET: production
      SOURCE_SHA: 3e25c76157dbd5086865cf27249f27581edb1fa4
    steps:
      - name: Require Vercel credential
        run: test -n "$VERCEL_TOKEN"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify exact certified source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Re-run certified source qualification
        run: |
          npm run vercel:standard
          npm run release:lockfile
          npm run generated:check
          npm run validate
          npm run typecheck
          npm test
          npm run release:source
      - name: Reconcile Vercel project and Production environment
        id: provision
        run: npm run vercel:bootstrap
      - name: Pull Production project settings
        run: npx --yes vercel@50.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production-configured candidate
        run: npx --yes vercel@50.1.0 build --prod --token="$VERCEL_TOKEN"
      - name: Qualify exact candidate artifact
        run: node --experimental-strip-types scripts/qualify-hub-release.mjs --dist .vercel/output/static
      - name: Deploy candidate without assigning domains
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@50.1.0 deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          [[ "$url" == https://*.vercel.app ]] || { echo "Unexpected Vercel deployment URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify exact served public artifact
        run: node --experimental-strip-types scripts/smoke-hub-release.mjs --url "${{ steps.deploy.outputs.url }}"
      - name: Verify P4 private runtime remains fail-closed
        run: npm run vercel:candidate-smoke -- --url "${{ steps.deploy.outputs.url }}"
      - name: Inspect candidate
        run: npx --yes vercel@50.1.0 inspect "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN"
      - name: Record immutable candidate evidence
        run: >-
          node scripts/vercel/release-control.mjs record
          --action candidate --sha "$SOURCE_SHA"
          --url "${{ steps.deploy.outputs.url }}"
          --project-id "${{ steps.provision.outputs.project-id }}"
          --project-name "${{ steps.provision.outputs.project-name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: p6-first-certified-candidate
          path: |
            .cache/hub-release-qualification.json
            .cache/vercel-release-record.json
          retention-days: 90
      - name: Summary
        run: |
          {
            echo "### P6 certified candidate"
            echo "- Source: $SOURCE_SHA"
            echo "- Project: ${{ steps.provision.outputs.project-name }}"
            echo "- Candidate: ${{ steps.deploy.outputs.url }}"
            echo "- Domain assignment: skipped"
            echo "- Private runtime: disabled"
            echo "- thiepn.dev: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
