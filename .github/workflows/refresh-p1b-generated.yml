name: Refresh P1B generated catalogue

on:
  push:
    paths:
      - '.github/workflows/refresh-p1b-generated.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh derived catalogue files
        run: npm run catalogue:refresh

      - name: Commit generated outputs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated catalogue is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated public/og public/catalogue.json public/search-index.json public/route-manifest.json 2>/dev/null || true
          git add -u
          git commit -m "Refresh generated catalogue for captured TBC media"
          git pull --rebase origin main
          git push origin HEAD:main
