name: Studio final checks
on:
  push:
    branches: [redesign/curated-studio-2026-09]
    paths: ['.github/workflows/studio-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/curated-studio-2026-09
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Complete editorial corrections and synchronized share assets
        run: |
          mkdir -p studio-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/content/projects/micro-arcade.md')
          p.write_text(p.read_text().replace('thirty-one distinct mini-games','distinct mini-games').replace('Install the arcade as a PWA and keep the game shell, lazy-loaded game chunks, local progress, favorites, and high scores available offline.','Install the arcade as a PWA. The shell and previously loaded game assets can be reused offline, while progress and high scores stay in this browser.'))
          p=Path('src/data/showcase.json'); j=json.loads(p.read_text())
          j['projects']['pdf-studio']['note']='Release candidate. Keep original documents and check exported files before relying on them.'
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          p=Path('README.md'); s=p.read_text()
          if 'Social-image regeneration' not in s:s+='\n## Social-image regeneration\n\nAfter changing a project subtitle, title or accent, run `npx playwright install chromium`, then `node scripts/rasterize-og.mjs` and `npm run catalogue:refresh`. Commit the updated `public/og` images and `src/generated` records. The build deliberately rejects stale social-image derivatives rather than sharing outdated content.\n'
          p.write_text(s)
          PY
          node scripts/rasterize-og.mjs > studio-evidence/og.log 2>&1
          npm run catalogue:refresh > studio-evidence/refresh.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public/og README.md
          if ! git diff --cached --quiet; then git commit -m 'fix: synchronize share cards and clarify product availability'; git push origin HEAD:redesign/curated-studio-2026-09; fi
      - name: Source checks
        run: |
          npm run generated:check > studio-evidence/generated.log 2>&1
          npm run validate > studio-evidence/validate.log 2>&1
          npm run typecheck > studio-evidence/typecheck.log 2>&1
          npm test > studio-evidence/unit.log 2>&1
          npm run build > studio-evidence/build.log 2>&1
          npm run perf:budget > studio-evidence/performance.log 2>&1
          npm run perf:scale > studio-evidence/scale.log 2>&1
          npm run test:automation > studio-evidence/automation.log 2>&1
          npm audit --json > studio-evidence/dependency-audit.json
      - name: Browser tests
        id: browser
        continue-on-error: true
        run: npm run test:e2e
      - name: Render and inspect product starts
        if: always()
        run: |
          if [ -f dist/index.html ]; then
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
            for i in $(seq 1 20); do curl -s http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
            node scripts/capture-studio.mjs
            cp /tmp/preview.log studio-evidence/preview.log
          fi
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='public' --exclude='src/assets' --exclude='studio-evidence' --exclude='test-results' --exclude='playwright-report' -czf /tmp/verified-source.tar.gz .
          cp /tmp/verified-source.tar.gz studio-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-final-checks
          path: |
            studio-evidence/
            test-results/
            playwright-report/
          retention-days: 7
      - name: Require actual passing browser tests
        if: always()
        run: |
          python - <<'PY'
          import json
          j=json.load(open('test-results/studio.json'))
          assert not j.get('errors'), j.get('errors')
          assert j['stats']['expected'] > 0, 'No tests executed'
          assert j['stats']['unexpected'] == 0, j['stats']
          assert j['stats']['flaky'] == 0, j['stats']
          print(j['stats'])
          PY
