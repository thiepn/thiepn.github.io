name: Phase 15 Bootstrap

on:
  push:
    branches: [agent/phase15-production]
    paths:
      - '.phase15/**'
      - '.github/workflows/phase15-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.phase15/**'
      - '.github/workflows/phase15-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: phase15-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-certify:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[phase15-materialized]')) || (github.event_name == 'pull_request' && github.head_ref == 'agent/phase15-production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staged candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Reconstruct and verify exact Phase 15 archives
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .phase15/payload16 -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 15
          cat .phase15/payload16/part-*.b64 | base64 --decode > /tmp/phase15-runtime.tar.xz
          echo 'acc947f66222c5b9ac586ec8146c3d07c883b37ac2746a770024ae491c1ce9bc  /tmp/phase15-runtime.tar.xz' | sha256sum --check --strict
          mkdir -p /tmp/phase15-source
          tar -xJf /tmp/phase15-runtime.tar.xz -C /tmp/phase15-source
          test -f /tmp/phase15-source/package.json
          test -f /tmp/phase15-source/CNAME
          test "$(cat /tmp/phase15-source/CNAME)" = 'thiepn.dev'

          test "$(find .phase15/required-docs -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 3
          cat .phase15/required-docs/part-*.b64 | base64 --decode > /tmp/phase15-required-docs.tar.xz
          echo '0b94fc51fef2f6a85bbfb0aba94aa28d1b322f2ab681af1e9730826cbedc70dc  /tmp/phase15-required-docs.tar.xz' | sha256sum --check --strict
          mkdir -p /tmp/phase15-required-docs
          tar -xJf /tmp/phase15-required-docs.tar.xz -C /tmp/phase15-required-docs
          test -f /tmp/phase15-required-docs/docs/PHASE_14_REPORT.md
          test -f /tmp/phase15-required-docs/docs/RELEASE_CANDIDATE.md

          test "$(find .phase15/source-fixes -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 2
          cat .phase15/source-fixes/part-*.b64 | base64 --decode > /tmp/phase15-source-fixes.tar.xz
          echo '007db5cc9f9357877f40d91561e9fb64bfca5963c1c706622e82566b1f008280  /tmp/phase15-source-fixes.tar.xz' | sha256sum --check --strict
          mkdir -p /tmp/phase15-source-fixes
          tar -xJf /tmp/phase15-source-fixes.tar.xz -C /tmp/phase15-source-fixes
          test -f /tmp/phase15-source-fixes/package.json
          grep -q '"@types/node"' /tmp/phase15-source-fixes/package.json

          cp .phase15/PHASE_15_REPORT.md /tmp/PHASE_15_REPORT.md
          test -s /tmp/PHASE_15_REPORT.md

      - name: Replace staging tree with verified production source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/phase15-source/. .

          mkdir -p docs
          for file in DESIGN_SYSTEM.md CONTENT_MODEL.md ARCHITECTURE.md MASTER_IMPLEMENTATION_PROMPT.md; do
            git show "origin/main:docs/$file" > "docs/$file"
          done
          cp -a /tmp/phase15-required-docs/docs/. docs/
          cp /tmp/PHASE_15_REPORT.md docs/PHASE_15_REPORT.md
          cp -a /tmp/phase15-source-fixes/. .

          test ! -d .phase15
          test -f .github/workflows/deploy.yml
          test -f docs/DESIGN_SYSTEM.md
          test -f docs/AUTOMATION.md
          test -f docs/ACCESSIBILITY.md
          test -f docs/VISUAL_REGRESSION.md
          test -f docs/RELEASE_CANDIDATE.md
          test -f docs/PHASE_15_REPORT.md
          grep -q '"@types/node"' package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Track candidate tree for lockfile certification
        run: git add -A

      - name: Phase 15 production-source gate
        run: npm run phase15:validate

      - name: Tracked lockfile gate
        run: npm run release:lockfile

      - name: Generated catalogue freshness
        run: npm run generated:check

      - name: Structural validation
        run: npm run validate

      - name: Release source audit
        run: npm run release:source

      - name: Accessibility source audit
        run: npm run a11y:source

      - name: Visual-language source audit
        run: npm run visual:audit

      - name: Source performance budgets
        run: npm run perf:source

      - name: 250-artifact scale benchmark
        run: npm run perf:scale

      - name: Static link validation
        run: npm run links:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Built performance budgets
        run: npm run perf:budget

      - name: Install certification browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser release certification
        run: npm run test:e2e:release

      - name: Automation fixture
        run: npm run test:automation

      - name: Online repository/project health
        run: npm run release:links

      - name: Capture 16 canonical visual states
        run: npm run visual:capture

      - name: Build visual review contact sheet
        run: npm run visual:contact-sheet

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-bootstrap-visual-review
          path: |
            artifacts/visual/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

      - name: Commit materialized certified candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build(release): materialize Phase 15 candidate [phase15-materialized]'
          git push origin HEAD:agent/phase15-production
