name: Toolbox evidence
on:
  push:
    branches: [fix/tiny-tools-suite-positioning]
    paths: ['.github/workflows/toolbox-evidence.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Source and suite evidence
        run: |
          mkdir -p toolbox-evidence
          git archive HEAD | gzip > toolbox-evidence/source.tar.gz
          git clone --depth 1 https://github.com/thiepn/tools.git /tmp/tiny-tools
          git -C /tmp/tiny-tools rev-parse HEAD > toolbox-evidence/tools-sha.txt
          git -C /tmp/tiny-tools archive HEAD | gzip > toolbox-evidence/tools.tar.gz
          cat > toolbox-inspect.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import fs from 'node:fs';
          const browser=await chromium.launch();const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.goto('https://thiepn.dev/tools/',{waitUntil:'networkidle'});
          await page.screenshot({path:'toolbox-evidence/suite-home.png',fullPage:true});
          fs.writeFileSync('toolbox-evidence/suite-home.html',await page.content());
          fs.writeFileSync('toolbox-evidence/suite-observations.json',JSON.stringify({text:await page.locator('body').innerText(),links:await page.locator('a[href]').evaluateAll(es=>es.map(e=>({text:e.innerText,href:e.href}))),controls:await page.locator('button').allTextContents()},null,2));
          await browser.close();
          JS
          node toolbox-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-evidence
          path: toolbox-evidence/
          retention-days: 7
