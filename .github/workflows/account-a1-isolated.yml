name: Account A1 isolated no-Web-Locks diagnostics
on:
  pull_request:
    paths:
      - 'src/lib/hub-account-persistence.ts'
      - 'src/lib/hub-account-storage.ts'
      - 'src/scripts/hub-account.ts'
      - 'vendor/account-session/src/**'
      - 'tests/studio/hub-sync.spec.ts'
      - '.github/workflows/account-a1-isolated.yml'
  push:
    branches: [fix/account-cross-tab-a1]
    paths:
      - 'src/lib/hub-account-persistence.ts'
      - 'src/lib/hub-account-storage.ts'
      - 'src/scripts/hub-account.ts'
      - 'vendor/account-session/src/**'
      - 'tests/studio/hub-sync.spec.ts'
      - '.github/workflows/account-a1-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-a1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cross-tab-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build isolated Hub source
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Restricted-storage safety — zero uncoordinated refreshes
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A1 restricted storage and no Web Locks' \
            --repeat-each=3 --workers=1 --reporter=line
      - name: Normal IndexedDB lease and signed-in continuity
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'concurrent new tabs share one rotating refresh even without Web Locks' \
            --repeat-each=3 --workers=1 --reporter=line
      - name: A2 bounded contention and stale-mirror isolation (Chromium and WebKit)
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A2 ' \
            --repeat-each=3 --workers=1 --reporter=line
      - name: A3 bounded adversarial Account scenarios (Chromium and WebKit)
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A3 ' \
            --repeat-each=2 --workers=1 --reporter=line
      - name: Preserve failure-only traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-a1-isolated-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
