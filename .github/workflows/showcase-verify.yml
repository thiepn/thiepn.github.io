name: Showcase release verification
on:
  push:
    branches: [design/showcase-tiny-tools]
    paths: ['.github/workflows/showcase-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/showcase-tiny-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate and refine source
        run: |
          if ! grep -q "import '../styles/showcase.css'" src/layouts/BaseLayout.astro; then python scripts/integrate-showcase.py; fi
          python scripts/finalize-showcase.py
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Regenerate share assets and source records
        run: |
          mkdir -p showcase-qa
          node scripts/rasterize-og.mjs > showcase-qa/og.log 2>&1
          npm run catalogue:refresh > showcase-qa/generated.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests README.md scripts/validate-catalogue.mjs public/og
          if ! git diff --cached --quiet; then git commit -m 'fix: clarify deferred media and complete interactive showcase verification'; git push origin HEAD:design/showcase-tiny-tools; fi
      - name: Source and production checks
        run: |
          npm run generated:check > showcase-qa/generated-check.log 2>&1
          npm run validate > showcase-qa/validate.log 2>&1
          npm run typecheck > showcase-qa/typecheck.log 2>&1
          npm test > showcase-qa/unit.log 2>&1
          npm run build > showcase-qa/build.log 2>&1
          npm run perf:budget > showcase-qa/performance.log 2>&1
          npm run perf:scale > showcase-qa/scale.log 2>&1
          npm run test:automation > showcase-qa/automation.log 2>&1
          npm audit --json > showcase-qa/dependency-audit.json
      - name: Browser journey tests
        continue-on-error: true
        run: npm run test:e2e
      - name: Render and inspect the built site
        if: always()
        run: |
          if [ -f dist/index.html ]; then
            npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/showcase-preview.log 2>&1 &
            for i in $(seq 1 20); do curl -s http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
            node scripts/capture-showcase-qa.mjs
          fi
      - name: Archive reviewable source and results
        if: always()
        run: |
          mkdir -p showcase-qa
          git rev-parse HEAD > showcase-qa/tested-sha.txt
          git archive HEAD | gzip > showcase-qa/verified-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-verification
          path: |
            showcase-qa/
            test-results/
            playwright-report/
          retention-days: 7
      - name: Require passing and nonempty browser results
        if: always()
        run: |
          python - <<'PY'
          import json
          j=json.load(open('test-results/studio.json'))
          assert not j.get('errors'), j.get('errors')
          assert j['stats']['expected'] > 0, 'No browser tests executed'
          assert j['stats']['unexpected'] == 0 and j['stats']['flaky'] == 0, j['stats']
          print(j['stats'])
          PY
