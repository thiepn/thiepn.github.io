name: Capture Hub media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-hub-media.yml'
      - 'scripts/capture-hub-media.mjs'
      - 'src/data/hub.json'
      - 'src/content/projects/**'
      - 'src/pages/scan/**'
      - 'public/scan/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: capture-hub-media
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live Hub apps
        run: node scripts/capture-hub-media.mjs

      - name: Commit canonical Hub media
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/hub src/generated/hub-media.json
          if git diff --cached --quiet; then
            echo "Canonical Hub media is already current."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh canonical Hub media"

          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Canonical Hub media pushed successfully."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo "Failed to push canonical Hub media after 4 attempts."
          exit 1

      - name: Deploy refreshed main
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
