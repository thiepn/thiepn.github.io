name: Capture Hub media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-hub-media.yml'
      - 'scripts/capture-hub-media.mjs'
      - 'src/data/hub.json'
      - 'src/data/scan-distribution.json'
      - 'src/content/projects/**'
      - 'src/pages/scan/**'
      - 'public/scan/**'

permissions:
  contents: read

concurrency:
  group: capture-hub-media
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live Hub apps
        run: node scripts/capture-hub-media.mjs

      - name: Prepare generated changes for PR review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          git add src/assets/hub src/generated/hub-media.json
          node scripts/export-generated-review.mjs

      - name: Upload generated review patch
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-capture-hub-media
          path: ${{ runner.temp }}/generated-review/
          if-no-files-found: error
          retention-days: 14
