name: Capture Hub media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-generated-review.mjs'
      - '.github/workflows/capture-hub-media.yml'
      - 'scripts/capture-hub-media.mjs'
      - 'src/data/hub.json'
      - 'src/data/scan-distribution.json'
      - 'src/content/projects/**'
      - 'src/pages/scan/**'
      - 'public/scan/**'

permissions:
  contents: read

concurrency:
  group: capture-hub-media
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live Hub apps
        run: node scripts/capture-hub-media.mjs

      - name: Package generated changes as an owner-reviewable binary patch
        run: node scripts/prepare-generated-review.mjs capture-hub-media

      - name: Retain complete generated change patch and manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-capture-hub-media
          path: .cache/generated-review/capture-hub-media/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
