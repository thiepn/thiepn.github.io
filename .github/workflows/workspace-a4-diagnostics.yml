name: Workspace A4 isolated restricted-storage diagnostics
on:
  push:
    branches: [diagnostic/workspace-restricted-a4]
  pull_request:
    paths:
      - 'tests/studio/workspace-a4.spec.ts'
      - '.github/workflows/workspace-a4-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-a4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a4-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Cold-init, warmed CAS, session fallback and reload (both engines)
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/workspace-a4.spec.ts \
            --workers=1 --reporter=line
      - name: Preserve failed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-a4-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
