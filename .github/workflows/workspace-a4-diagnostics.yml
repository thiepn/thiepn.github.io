name: Workspace A4 isolated restricted-storage diagnostics
on:
  push:
    branches: [diagnostic/workspace-restricted-a4]
  pull_request:
    paths:
      - 'tests/studio/workspace-a4.spec.ts'
      - 'src/scripts/workspace-home.ts'
      - '.github/workflows/workspace-a4-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-a4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a4-diagnostics:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.61.1
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Official pinned Playwright image contains the correct browser builds
      # and system libraries; avoids runner apt dependency stalls.
      - name: Verify pinned Chromium and WebKit launch
        id: a4_browsers
        run: |
          node --input-type=module -e "import{chromium,webkit}from'playwright';for(const [name,type] of [['chromium',chromium],['webkit',webkit]]){const b=await type.launch({headless:true});await b.close();console.log(name+' launches');}"
      - name: Cold-init, warmed CAS, session fallback and reload (both engines)
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/workspace-a4.spec.ts \
            --workers=1 --reporter=line
      - name: A4 acceptance of original A3 restricted-storage task-save-and-reload (both browsers)
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A3 restricted-storage' \
            --repeat-each=4 --workers=1 --reporter=line
      - name: Preserve 36 Account authentication regressions (A1 A2 A3)
        if: ${{ !cancelled() && steps.a4_browsers.outcome == 'success' }}
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A1 restricted storage and no Web Locks|concurrent new tabs share one rotating refresh even without Web Locks|A2 ' \
            --repeat-each=3 --workers=1 --reporter=line
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A3 (SDK|legacy|foreign)' \
            --repeat-each=2 --workers=1 --reporter=line
      - name: Preserve failed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-a4-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
