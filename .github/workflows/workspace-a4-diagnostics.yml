name: Workspace A4 isolated restricted-storage diagnostics
on:
  push:
    branches: [diagnostic/workspace-restricted-a4]
  pull_request:
    paths:
      - 'tests/studio/workspace-a4.spec.ts'
      - 'src/scripts/workspace-home.ts'
      - '.github/workflows/workspace-a4-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-a4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a4-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # A4 runner timed out in --with-deps installation on the first attempt.
      # Use a bounded browser-only install, with explicit binary validation.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-a4-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit (bounded)
        id: a4_browsers
        timeout-minutes: 10
        run: |
          npx playwright install chromium webkit
          node -e "const fs=require('node:fs');const p=require('playwright');for(const n of ['chromium','webkit']){const path=p[n].executablePath();if(!fs.existsSync(path)){console.error('Missing '+n+' executable');process.exitCode=1;}else{console.log(n+' binary verified');}}"

      - name: Cold-init, warmed CAS, session fallback and reload (both engines)
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/workspace-a4.spec.ts \
            --workers=1 --reporter=line
      - name: Preserve 36 Account authentication regressions (A1 A2 A3)
        if: ${{ !cancelled() && steps.a4_browsers.outcome == 'success' }}
        run: |
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A1 restricted storage and no Web Locks|concurrent new tabs share one rotating refresh even without Web Locks|A2 ' \
            --repeat-each=3 --workers=1 --reporter=line
          npx playwright test -c playwright.studio.config.ts \
            --project=chromium --project=webkit \
            tests/studio/hub-sync.spec.ts \
            -g 'A3 (SDK|legacy|foreign)' \
            --repeat-each=2 --workers=1 --reporter=line
      - name: Preserve failed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-a4-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
