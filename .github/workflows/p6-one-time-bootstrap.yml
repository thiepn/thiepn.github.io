name: P6 One-Time Vercel Bootstrap Candidate

on:
  push:
    branches: [vercel-p6-bootstrap-candidate]

permissions:
  contents: read

concurrency:
  group: p6-one-time-vercel-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: thiepn-hub
      VERCEL_ENV_TARGET: production
    steps:
      - uses: actions/checkout@v7

      - name: Detect Vercel deployment credential
        id: credential
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### P6 bootstrap blocked"
              echo "- VERCEL_TOKEN is not configured in this repository."
              echo "- No Vercel project/environment/deployment write was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v6
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.credential.outputs.available == 'true'
        run: npm ci --no-audit --no-fund

      - name: Requalify source before first external write
        if: steps.credential.outputs.available == 'true'
        run: |
          npm run vercel:standard
          npm run release:lockfile
          npm run generated:check
          npm run validate
          npm run typecheck
          npm test
          npm run release:source

      - name: Bootstrap real Vercel project and Production public environment
        if: steps.credential.outputs.available == 'true'
        id: provision
        run: npm run vercel:bootstrap

      - name: Pull Production project settings
        if: steps.credential.outputs.available == 'true'
        run: >-
          npx --yes vercel@50.1.0 pull --yes --environment=production
          --project="${{ steps.provision.outputs.project-id }}"
          --token="$VERCEL_TOKEN"

      - name: Build production-configured candidate
        if: steps.credential.outputs.available == 'true'
        run: >-
          npx --yes vercel@50.1.0 build --prod
          --project="${{ steps.provision.outputs.project-id }}"
          --token="$VERCEL_TOKEN"

      - name: Qualify exact candidate artifact
        if: steps.credential.outputs.available == 'true'
        run: >-
          node --experimental-strip-types
          scripts/qualify-hub-release.mjs
          --dist .vercel/output/static

      - name: Deploy no-domain candidate
        if: steps.credential.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(
            npx --yes vercel@50.1.0 deploy               --prebuilt               --prod               --skip-domain               --yes               --project="${{ steps.provision.outputs.project-id }}"               --token="$VERCEL_TOKEN" |
            tail -n 1
          )"
          [[ "$url" == https://*.vercel.app ]] || { echo "Unexpected Vercel deployment URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact served public artifact
        if: steps.credential.outputs.available == 'true'
        run: >-
          node --experimental-strip-types
          scripts/smoke-hub-release.mjs
          --url "${{ steps.deploy.outputs.url }}"

      - name: Verify P4 private runtime remains disabled
        if: steps.credential.outputs.available == 'true'
        run: npm run vercel:candidate-smoke -- --url "${{ steps.deploy.outputs.url }}"

      - name: Inspect candidate
        if: steps.credential.outputs.available == 'true'
        run: >-
          npx --yes vercel@50.1.0 inspect
          "${{ steps.deploy.outputs.url }}"
          --project="${{ steps.provision.outputs.project-id }}"
          --token="$VERCEL_TOKEN"

      - name: Record immutable candidate evidence
        if: steps.credential.outputs.available == 'true'
        run: >-
          node scripts/vercel/release-control.mjs record
          --action candidate
          --sha "$GITHUB_SHA"
          --url "${{ steps.deploy.outputs.url }}"
          --project-id "${{ steps.provision.outputs.project-id }}"
          --project-name "${{ steps.provision.outputs.project-name }}"

      - uses: actions/upload-artifact@v4
        if: steps.credential.outputs.available == 'true'
        with:
          name: p6-first-vercel-candidate
          path: |
            .cache/hub-release-qualification.json
            .cache/vercel-release-record.json
          retention-days: 30

      - name: Candidate summary
        if: steps.credential.outputs.available == 'true'
        run: |
          {
            echo "### P6 first certified Vercel candidate"
            echo "- Source: $GITHUB_SHA"
            echo "- Project: ${{ steps.provision.outputs.project-name }}"
            echo "- Project created: ${{ steps.provision.outputs.project-created }}"
            echo "- Candidate: ${{ steps.deploy.outputs.url }}"
            echo "- Build environment: production"
            echo "- Custom-domain assignment: skipped"
            echo "- thiepn.dev: unchanged"
            echo "- Promotion: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
