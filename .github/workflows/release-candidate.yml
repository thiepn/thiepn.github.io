name: Production Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install certification browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Production source gate
        run: |
          npm run phase15:validate
          npm run release:source

      - name: Media audit
        run: npm run media:validate

      - name: Generate certification visual baselines
        run: npm run visual:update

      - name: Full release audit
        run: npm run audit:release

      - name: Capture canonical visual review states
        run: npm run visual:capture

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-certification-visual-review
          path: |
            tests/visual/baselines/*.png
            artifacts/visual/current/*.png
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

      - name: Online launch/repository health
        run: npm run release:links

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-certification-failure-diagnostics
          path: |
            test-results/**
            playwright-report/**
            artifacts/visual/**
          if-no-files-found: ignore
