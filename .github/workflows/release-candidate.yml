name: Release Candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install certification browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Release-candidate source gate
        run: npm run release:source

      - name: Generate candidate visual baselines
        run: npm run visual:update

      - name: Full release audit
        run: npm run audit:release

      - name: Capture canonical visual review states
        run: npm run visual:capture

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-visual-review
          path: |
            tests/visual/baselines/*.png
            artifacts/visual/current/*.png
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

      - name: Online launch/repository health
        run: npm run release:links

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-failure-diagnostics
          path: |
            test-results/**
            playwright-report/**
            artifacts/visual/**
          if-no-files-found: ignore
