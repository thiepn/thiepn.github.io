name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: THIEPN Account security contract
        run: npm run account:contract
      - run: npm run audit:studio
      - name: Retained scale and automation checks
        run: npm run perf:scale && npm run test:automation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-certification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
