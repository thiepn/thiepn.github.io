name: Quality
on:
  push:
    branches: [main]
  # Fallback for a missing push event; production authorization still requires
  # a SUCCESSFUL exact-SHA push Quality run, not workflow_dispatch.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Owner-approved release gate regression tests (no publishing)
        run: node --test tests/hub-owner-release-gate.test.mjs
      - name: Generated update review boundary
        run: node --test tests/generated-review-boundary.test.mjs
      # Verify release source before spending time on the full browser matrix.
      # The existing post-audit release qualification remains mandatory.
      - name: Release source availability preflight
        run: node --test tests/release-project-availability.test.mjs && npm run release:source
      - name: Account CI boundary regressions
        run: node --test tests/hub-account-ci-boundaries.test.mjs
      - name: Product registry v2 contract
        run: node scripts/validate-product-registry-v2.mjs
      - name: Platform P9 Folio projection
        run: node scripts/validate-folio-p9.mjs
      - name: Platform P10 Bible + Games projection
        run: node scripts/validate-family-p10.mjs
      - name: Platform P11 shared runtime review
        run: node scripts/validate-runtime-p11.mjs
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      # Fail fast on the exact calendar browser path before running 1,000+ tests.
      # The studio Chromium project uses Playwright's full new-headless Chromium,
      # not chromium_headless_shell (which SIGSEGV'd twice on the runner).
      - name: Full Chromium calendar startup smoke
        run: |
          npm run build
          npx playwright test -c playwright.studio.config.ts --project=chromium tests/studio/hub-calendar-c1.spec.ts tests/studio/hub-calendar-composition-c2.spec.ts -g 'calendar selected day remains circular|C2 original local event flows through ephemeral native calendar projection'
      - name: Account cross-tab refresh and durable-token smoke
        run: npx playwright test -c playwright.studio.config.ts --project=chromium --project=firefox --project=webkit tests/studio/hub-sync.spec.ts -g 'concurrent new tabs share one rotating refresh even without Web Locks|durable Account token cannot be downgraded|Account startup recovers an abandoned lifetime lease'
      - name: Curated Hub and public preview regression smoke
        run: npx playwright test -c playwright.studio.config.ts tests/studio/studio.spec.ts tests/studio/hub-integrated-home.spec.ts tests/studio/hub-sync.spec.ts tests/studio/office-documents.spec.ts -g 'Hub hierarchy and layout|Hub renders the locked app membership|public route content and metadata /byte/|daily Hub summary uses original local planner commands|Connections preserves last success|hidden language apps do not request|O2 formatting actions update Markdown|Office inline formatting remains usable'
      - name: Workspace committed layout and asynchronous reload smoke
        run: npx playwright test -c playwright.studio.config.ts --project=chromium --project=firefox --project=webkit tests/studio/workspace.spec.ts -g 'pointer drag and resize commit logical placement|a delayed automatic reload cannot replace'
      - run: npm run audit:studio
      - name: Hub public release profile gate
        run: npm run release:source && npm run hub:qualify && npm run test:hub-release && npm run test:hub-smoke
      - name: Retained scale and automation checks
        run: npm run perf:scale && npm run test:hub-scale && npm run test:automation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-certification
          path: |
            playwright-report/
            test-results/
            .cache/hub-release-qualification.json
          retention-days: 7
          include-hidden-files: true
