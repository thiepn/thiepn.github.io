name: P2C Generate Icon Binaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2c-generate-icons.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PNG icon set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          BG = (11, 12, 12, 255)
          FG = (240, 238, 232, 255)

          # Canonical 32x32 mark geometry, shared with favicon.svg and BrandMark.astro.
          rects = [
              (7.36, 8.48, 17.28, 2.24),
              (14.88, 9.44, 2.24, 15.52),
              (10.88, 18.40, 10.24, 1.92),
              (5.68, 7.44, 3.36, 3.36),
              (22.96, 7.44, 3.36, 3.36),
              (14.32, 23.28, 3.36, 3.36),
          ]

          def chunk(kind: bytes, payload: bytes) -> bytes:
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)

          def write_png(path: str, size: int):
              pixels = bytearray(BG * (size * size))

              def set_pixel(x, y, rgba):
                  if 0 <= x < size and 0 <= y < size:
                      i = (y * size + x) * 4
                      pixels[i:i+4] = bytes(rgba)

              scale = size / 32.0
              for x, y, w, h in rects:
                  x0 = max(0, round(x * scale))
                  y0 = max(0, round(y * scale))
                  x1 = min(size, round((x + w) * scale))
                  y1 = min(size, round((y + h) * scale))
                  for py in range(y0, y1):
                      for px in range(x0, x1):
                          set_pixel(px, py, FG)

              # Preserve the tiny negative-space node at the mark intersection used by favicon.svg.
              hx0 = max(0, round(15.44 * scale))
              hy0 = max(0, round(18.88 * scale))
              hx1 = min(size, max(hx0 + 1, round(16.56 * scale)))
              hy1 = min(size, max(hy0 + 1, round(20.00 * scale)))
              for py in range(hy0, hy1):
                  for px in range(hx0, hx1):
                      set_pixel(px, py, BG)

              raw = bytearray()
              stride = size * 4
              for y in range(size):
                  raw.append(0)  # PNG filter: None
                  raw.extend(pixels[y * stride:(y + 1) * stride])

              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
              png += chunk(b'IEND', b'')
              Path(path).write_bytes(png)

          write_png('public/favicon-32x32.png', 32)
          write_png('public/apple-touch-icon.png', 180)
          write_png('public/icon-192.png', 192)
          write_png('public/icon-512.png', 512)
          PY

      - name: Commit generated icons and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon-32x32.png public/apple-touch-icon.png public/icon-192.png public/icon-512.png
          git rm .github/workflows/p2c-generate-icons.yml
          git commit -m "Generate THIEPN PNG icon set"
          git push
