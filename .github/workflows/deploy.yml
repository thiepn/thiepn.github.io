name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact qualified main SHA (40 lowercase hex characters)"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact-main release
    if: github.ref == 'refs/heads/main' && github.actor == 'thiepn' && github.triggering_actor == 'thiepn'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the dispatch SHA (never unverified user input)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify owner, exact main SHA and successful push Quality
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_RELEASE_EXPECTED_SHA: ${{ inputs.release_sha }}
        run: node scripts/authorize-pages-release.mjs

  build:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact authorized release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Set up Node for release revalidation
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Revalidate exact main and CI before build
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_RELEASE_EXPECTED_SHA: ${{ inputs.release_sha }}
        run: node scripts/authorize-pages-release.mjs

      - name: Validate production source invariants
        run: node scripts/validate-phase15.mjs

      - name: Verify existing Pages workflow publishing (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // "legacy"')"
          test "$mode" = workflow || { echo "::error::GitHub Pages publishing must already use GitHub Actions."; exit 1; }

      - name: Install, enrich, build, and upload Astro site
        uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_HUB_ACCOUNT_ENTRY: ${{ vars.HUB_ACCOUNT_ENTRY }}
          PUBLIC_HUB_AUTH_ORIGIN: https://thiepn.dev
          PUBLIC_THIEPN_SUPABASE_URL: https://hycegznamzjhwinegaai.supabase.co
          PUBLIC_THIEPN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.THIEPN_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        with:
          node-version: 24
          package-manager: npm@11
          build-cmd: npm run validate && npm run release:source && npm run typecheck && npm test && npm run build:enriched && npm run perf:budget && npm run hub:qualify

      - name: Preserve Hub candidate fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: hub-release-qualification
          path: .cache/hub-release-qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == 'thiepn' && github.triggering_actor == 'thiepn'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Set up Node for final release check
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Revalidate main and Quality immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_RELEASE_EXPECTED_SHA: ${{ inputs.release_sha }}
        run: node scripts/authorize-pages-release.mjs

      - name: Deploy Astro artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify deployed production site
        env:
          PRODUCTION_URL: https://thiepn.dev/
        run: node scripts/smoke-production.mjs --url https://thiepn.dev/ --retries 12

      - name: Download qualified Hub fingerprints
        uses: actions/download-artifact@v4
        with:
          name: hub-release-qualification
          path: .cache

      - name: Verify exact qualified Hub artifact
        run: npm run hub:smoke

      # Project Pages owns /orrery/; this site's public/orrery copy is not
      # the served release. App-specific certification remains in orrery-burnin.yml.
      # Hub still requires all launcher availability and exact artifact checks above.
