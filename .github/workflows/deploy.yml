name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect and migrate Pages publishing mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "legacy"' 2>/dev/null || echo unknown)"
          echo "GitHub Pages publishing mode: ${mode}"
          if [ "${mode}" != "workflow" ] && [ "${mode}" != "unknown" ]; then
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
              echo "Switched GitHub Pages publishing mode to workflow."
            else
              echo "::warning::GitHub Pages is still configured for branch/Jekyll publishing. The repository token cannot change that admin setting. In Settings → Pages → Build and deployment, set Source to GitHub Actions. This Astro workflow remains the authoritative deployment path."
            fi
          elif [ "${mode}" = "unknown" ]; then
            echo "::warning::Could not read GitHub Pages publishing mode; continuing with the authoritative Astro deployment workflow."
          fi

      - name: Install, enrich, build, and upload Astro site
        uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version: 24
          package-manager: npm@11
          build-cmd: npm run build:enriched

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Astro artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify deployed production site
        env:
          PRODUCTION_URL: https://thiepn.dev/
        run: node scripts/smoke-production.mjs --url https://thiepn.dev/ --retries 12
