          CERTIFIED_MANIFEST
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,json,concurrent.futures
          expected={'pdf':{'origin':'https://423ad834.thiepn-pdf-stable-recovery.pages.dev/pdf/','release':'7.1.4','manifest':'d1ea2dae17ea5fe0d4c56f2046acaded1841d0ef9c1dccde043ff73e6032b5f7'},'diet':{'origin':'https://85cb90d0.thiepn-diet-certified-recovery.pages.dev/diet/','release':'48498e9dc9a1c92e1ce4d141ed31ca434e5daac5','manifest':'5d7f10e980bcb610363482af8cf896115bbd1ebeea9c082e305d5ccf4825e2b4'}}
          def get(url,limit=26000000):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=28) as response:
                  return response.status,response.geturl(),response.headers,response.read(limit+1)
          status,url,headers,data=get('https://thiepn.dev/pdf/release-integrity.json',400000)
          assert status==200 and hashlib.sha256(data).hexdigest()==expected['pdf']['manifest'],('PDF manifest digest',status)
          pdf=json.loads(data)
          assert pdf['fileCount']==116 and len(pdf['files'])==116 and pdf['totalBytes']==18939068
          diet=json.load(open('/tmp/diet-runtime-manifest.json'))
          assert diet['source']==expected['diet']['release'] and len(diet['files'])==52
          assert sum(x['bytes'] for x in diet['files'])==1433207
          entries=[('pdf',x) for x in pdf['files']]+[('diet',x) for x in diet['files']]
          def check(item):
              app,f=item
              for origin in ['https://thiepn.dev/'+app+'/',expected[app]['origin']]:
                  target=origin+f['path']
                  status,final,h,b=get(target,f['bytes'])
                  assert status==200 and final in ([target,origin] if f['path']=='index.html' else [target]),(app,f['path'],status,final)
                  if not (len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']):
                      if f['path']=='index.html':
                          import difflib
                          original_base=expected[app]['origin']
                          _,_,_,reference=get(original_base+f['path'],f['bytes']+1024)
                          delta=list(difflib.unified_diff(reference.decode('utf-8','replace').splitlines(),b.decode('utf-8','replace').splitlines(),n=1))
                          print('HTML DIFF',app,origin,'expected',f['bytes'],'actual',len(b),'reference',hashlib.sha256(reference).hexdigest(),'actualSHA',hashlib.sha256(b).hexdigest(),'DIFF',delta[:15])
                      raise AssertionError(('HASH_MISMATCH',app,f['path'],origin,len(b)))
                  if origin.startswith('https://thiepn.dev/'):
                      key='x-thiepn-pdf-release' if app=='pdf' else 'x-thiepn-diet-source'
                      assert h.get(key)==expected[app]['release'],('SOURCE_DRIFT',app,f['path'],h.get(key))
              return app+'/'+f['path']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results=list(pool.map(check,entries))
          assert len(results)==168
          print('PASS: immutable + live PDF 116/116, Diet 52/52, exact release headers and independently pinned hashes')
          # Ensure same-origin canonical paths and no unintended write routes.
          for app in ['pdf','diet']:
              _,final,_,_=get('https://thiepn.dev/'+app)
              assert final=='https://thiepn.dev/'+app+'/',('REDIRECT_DRIFT',app,final)
              try:
                  get('https://thiepn.dev/'+app+'/api/copilot')
              except urllib.error.HTTPError as e:
                  if app=='diet': assert e.code in (403,404,405),e.code
          print('PASS: original canonical routes retained')
          PY
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify independent Vercel AI backend readiness and auth without provider requests
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          base='https://thiepn-diet.vercel.app/api/'
          def call(method,path,origin=None,body=None):
              h={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
              if origin:h['Origin']=origin
              if body is not None:h['Content-Type']='application/json'
              req=urllib.request.Request(base+path,method=method,headers=h,data=body)
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      return response.status,response.headers,response.read(3000)
              except urllib.error.HTTPError as exc:
                  return exc.code,exc.headers,exc.read(3000)
          status,h,b=call('GET','health')
          print('health status',status)
          assert status==200,('Backend health not reachable',status)
          v=json.loads(b)
          print('backend ready',v.get('ready'),'service',v.get('service'),'runtime',v.get('runtime'))
          assert v.get('ok') is True and v.get('runtime')=='vercel' and v.get('ready') is True,('Backend not ready',v)
          status,h,b=call('OPTIONS','copilot',origin='https://thiepn.dev')
          assert status==204 and h.get('Access-Control-Allow-Origin')=='https://thiepn.dev',('CORS failed',status,h.get('Access-Control-Allow-Origin'))
          status,_,_=call('GET','copilot',origin='https://thiepn.dev')
          assert status==405,('Unexpected method accepted',status)
          status,_,b=call('POST','copilot',origin='https://thiepn.dev',body=b'{}')
          assert status==401,('Missing authorization did not reject',status,b[:200])
          status,_,_=call('POST','copilot',origin='https://example.invalid',body=b'{}')
          assert status==403,('Foreign origin unexpectedly allowed',status)
          print('PASS: backend independent health, origin CORS, methods, no-auth and foreign-origin gates; zero provider calls')
          PY
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright, no application source or credentials
        run: |
          npm install --prefix /tmp/m03-browser --no-audit --no-fund --no-package-lock --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null; then
            echo "BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx --prefix /tmp/m03-browser playwright install --with-deps chromium
          fi
      - name: Disposable PWA offline and original URL acceptance
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '/tmp/m03-browser/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch(process.env.BROWSER_CHANNEL?{channel:process.env.BROWSER_CHANNEL}:{});
          try{
            for(const [app,title] of [['pdf','PDF Studio'],['diet','Diet Copilot']]){
              const context=await browser.newContext({serviceWorkers:'allow'});
              try{
                const page=await context.newPage();
                const url='https://thiepn.dev/'+app+'/';
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                assert.equal(response.status(),200,app);
                assert((await page.title()).includes(title),app+' title');
                await page.evaluate(async()=>{await navigator.serviceWorker.ready});
                if(!(await page.evaluate(()=>navigator.serviceWorker.controller!==null)))await page.reload({waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>navigator.serviceWorker.controller!==null,{timeout:25000});
                await context.setOffline(true);
                await page.reload({waitUntil:'domcontentloaded',timeout:25000});
                assert((await page.title()).includes(title),app+' offline title');
                await context.setOffline(false);
                console.log('PASS',app,'canonical PWA SW controlled offline reload');
              }finally{await context.close()}
            }
          }finally{await browser.close()}
          JS
