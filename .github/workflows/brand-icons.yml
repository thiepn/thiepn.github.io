name: Generate THIEPN brand icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/app-icon.svg
      - scripts/generate-brand-icons.mjs
      - .github/workflows/brand-icons.yml

permissions:
  contents: read

concurrency:
  group: thiepn-brand-icons
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate brand icon derivatives
        run: node scripts/generate-brand-icons.mjs

      - name: Prepare generated changes for PR review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          git add public/favicon-32x32.png public/apple-touch-icon.png public/icon-192.png public/icon-512.png
          node scripts/export-generated-review.mjs

      - name: Upload generated review patch
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-brand-icons
          path: ${{ runner.temp }}/generated-review/
          if-no-files-found: error
          retention-days: 14
