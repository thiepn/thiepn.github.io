name: Generate THIEPN brand icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/app-icon.svg
      - scripts/generate-brand-icons.mjs
      - .github/workflows/brand-icons.yml

permissions:
  contents: write

concurrency:
  group: thiepn-brand-icons
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate brand icon derivatives
        run: node scripts/generate-brand-icons.mjs

      - name: Commit refreshed icon derivatives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon-32x32.png public/apple-touch-icon.png public/icon-192.png public/icon-512.png
          if git diff --cached --quiet; then
            echo "Brand icon derivatives are already current."
            exit 0
          fi
          git commit -m "Refresh THIEPN brand icon derivatives"
          git pull --rebase origin main
          git push origin HEAD:main
