name: Generate THIEPN brand icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-generated-review.mjs'
      - public/app-icon.svg
      - scripts/generate-brand-icons.mjs
      - .github/workflows/brand-icons.yml

permissions:
  contents: read

concurrency:
  group: thiepn-brand-icons
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate brand icon derivatives
        run: node scripts/generate-brand-icons.mjs

      - name: Package generated changes as an owner-reviewable binary patch
        run: node scripts/prepare-generated-review.mjs brand-icons

      - name: Retain complete generated change patch and manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-brand-icons
          path: .cache/generated-review/brand-icons/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
