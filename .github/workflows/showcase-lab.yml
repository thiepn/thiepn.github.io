name: Showcase performance lab
on:
  push:
    branches: [design/showcase-tiny-tools]
    paths: ['.github/workflows/showcase-lab.yml']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/lighthouse-tools lighthouse
      - run: npm run build
      - name: Serve the separately deployed Library covers unchanged in local preview
        run: |
          mkdir -p dist/library/media/works/choosing-a-mission-organization dist/library/media/works/how-to-love-god/editions/1.1.0
          curl --fail --retry 2 https://thiepn.dev/library/media/works/choosing-a-mission-organization/cover.svg -o dist/library/media/works/choosing-a-mission-organization/cover.svg
          curl --fail --retry 2 https://thiepn.dev/library/media/works/how-to-love-god/editions/1.1.0/how-to-love-god.webp -o dist/library/media/works/how-to-love-god/editions/1.1.0/how-to-love-god.webp
      - name: Measure lab performance
        run: |
          mkdir -p lighthouse-evidence
          git rev-parse HEAD > lighthouse-evidence/tested-sha.txt
          node /tmp/lighthouse-tools/node_modules/lighthouse/cli/index.js --version > lighthouse-evidence/version.txt
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          for i in 1 2 3; do
            node /tmp/lighthouse-tools/node_modules/lighthouse/cli/index.js http://127.0.0.1:4321/ --chrome-flags='--headless --no-sandbox' --output=json --output-path=lighthouse-evidence/home-mobile-$i.json --quiet
          done
          node /tmp/lighthouse-tools/node_modules/lighthouse/cli/index.js http://127.0.0.1:4321/ --preset=desktop --chrome-flags='--headless --no-sandbox' --output=json --output-path=lighthouse-evidence/home-desktop.json --quiet
          node /tmp/lighthouse-tools/node_modules/lighthouse/cli/index.js http://127.0.0.1:4321/project/tiny-tools/ --chrome-flags='--headless --no-sandbox' --output=json --output-path=lighthouse-evidence/tiny-tools-mobile.json --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-lighthouse
          path: lighthouse-evidence/
          retention-days: 7
