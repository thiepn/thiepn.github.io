name: P0 Generated Refresh

on:
  push:
    branches:
      - p0-portfolio-identity-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-portfolio-identity-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run catalogue:refresh
      - name: Commit generated portfolio outputs and remove temporary workflow
        run: |
          rm .github/workflows/p0-generated-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated public/og .github/workflows/p0-generated-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh generated portfolio metadata"
          git push origin HEAD:p0-portfolio-identity-cleanup
