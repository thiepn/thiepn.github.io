name: Hub Apps catalogue browsers

on:
  pull_request:
    paths:
      - '.github/workflows/hub-apps-catalogue-browsers.yml'
      - 'tests/studio/toolbox-overview.spec.ts'
      - 'tests/studio/hub-shortcuts.spec.ts'
      - 'tests/studio/launch-fixture.ts'
      - 'src/components/hub/**'
      - 'src/lib/launches/**'
      - 'src/scripts/hub-catalogue.ts'
      - 'src/generated/launch-manifest.json'
      - 'src/pages/apps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-apps-catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build original Hub catalogue and workspace
        run: npm run build
      - name: Install browsers and required Linux libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Apps counts, filtering, stable URLs and pin persistence in all three engines
        run: npx playwright test -c playwright.studio.config.ts --project=chromium --project=firefox --project=webkit tests/studio/toolbox-overview.spec.ts tests/studio/hub-shortcuts.spec.ts

  calendar-merged-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Preview Calendar PR 185 with Apps fix without touching either ref
        run: |
          git fetch --no-tags origin 1d947e51d77d9e9fd525919af80a14ea15d1cd13
          test "$(git rev-parse FETCH_HEAD)" = "1d947e51d77d9e9fd525919af80a14ea15d1cd13"
          git -c user.name="Hub CI" -c user.email="ci@example.invalid" merge --no-commit --no-ff FETCH_HEAD
          test -f scripts/check-studyos-calendar-edge.mjs
          git status --short
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/audit-tools axe-core@4.13.0
      - name: Install all three browsers with real Linux dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Qualify real StudyOS public CORS (no private tokens)
        run: node scripts/check-studyos-calendar-edge.mjs
      - name: TypeScript, units, build, perf budget and complete three-engine browser regressions
        run: npm run audit:studio
      - name: Original 31-public-app release boundary and device qualification
        run: npm run release:source && npm run hub:qualify && npm run test:hub-release && npm run test:hub-smoke
      - name: Retained scale and automation tests
        run: npm run perf:scale && npm run test:hub-scale && npm run test:automation
