name: Hub Apps catalogue browsers

on:
  pull_request:
    paths:
      - '.github/workflows/hub-apps-catalogue-browsers.yml'
      - 'tests/studio/toolbox-overview.spec.ts'
      - 'tests/studio/hub-shortcuts.spec.ts'
      - 'tests/studio/launch-fixture.ts'
      - 'src/components/hub/**'
      - 'src/lib/launches/**'
      - 'src/scripts/hub-catalogue.ts'
      - 'src/generated/launch-manifest.json'
      - 'src/pages/apps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-apps-catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build original Hub catalogue and workspace
        run: npm run build
      - name: Install Playwright browser binaries (runner image provides OS dependencies)
        run: npx playwright install chromium firefox webkit
      - name: Apps counts, filtering, stable URLs and pin persistence in all three engines
        run: npx playwright test -c playwright.studio.config.ts --project=chromium --project=firefox --project=webkit tests/studio/toolbox-overview.spec.ts tests/studio/hub-shortcuts.spec.ts
