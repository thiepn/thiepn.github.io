name: Phase 16B-11 homepage intro alignment

on:
  push:
    branches: [agent/phase16b11-home-identity]
    paths:
      - '.github/workflows/phase16b11-intro-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase16b11-home-identity
          fetch-depth: 0
      - name: Include books in first-fold portfolio summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.astro')
          text = path.read_text()
          old = 'Software, games, learning systems, publishing tools and experiments — designed, built and refined as real products.'
          new = 'Software, games, learning systems, books, publishing tools and experiments — designed, built and refined as real products.'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one homepage intro to update')
          path.write_text(text.replace(old, new))
          PY
          grep -q 'learning systems, books, publishing tools' src/pages/index.astro
      - name: Commit homepage intro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git commit -m 'fix: include books in homepage portfolio summary'
          git pull --rebase origin agent/phase16b11-home-identity
          git push origin HEAD:agent/phase16b11-home-identity
