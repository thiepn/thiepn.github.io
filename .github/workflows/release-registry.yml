name: THIEPN Release Registry v1
on:
  pull_request:
    paths:
      - "src/lib/release-certificates.mjs"
      - "src/data/release-certificates.v1.json"
      - "src/data/development-inventory.v1.json"
      - "src/generated/launch-manifest.json"
      - "contracts/release-certificates.v1.schema.json"
      - "tests/release-certificates.test.mjs"
      - "scripts/release/**"
      - "tests/release-live-readonly.mjs"
      - "tests/release-production-workflows.mjs"
      - "tests/studio/release-catalogue.spec.ts"
      - "tests/studio/toolbox-overview.spec.ts"
      - "src/lib/hub.ts"
      - "src/components/hub/HubCatalogue.astro"
      - "src/pages/dev/release-apps/index.astro"
      - ".github/workflows/release-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-registry:
    name: Validate draft release certificates (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate original launch identities and adversarial approval gating
        run: node --test tests/release-certificates.test.mjs

  anonymous-live-smoke:
    name: Anonymous production loads (observational, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Read-only anonymous 1440px and 390px load probes (no account interaction)
        run: node tests/release-live-readonly.mjs

  draft-catalogue-browser:
    name: Qualified roster and legacy browser regression (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Assert certified-only preview, legacy Apps unchanged and real category counts
        run: npx playwright test -c playwright.studio.config.ts --project=chromium tests/studio/release-catalogue.spec.ts tests/studio/toolbox-overview.spec.ts

  clean30-pinned-rc1:
    name: Clean30 frozen-SHA local RC1 and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thiepn/clean30
          ref: 052731bd44f7e2113fd789be55dfb199d4f82fae
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record original dependency audit without hiding its failure
        id: dependency_audit
        continue-on-error: true
        run: npm run audit:release
      - name: Run every non-audit original RC1 source gate
        run: |
          npm test
          npm run build
          npm run verify:release
          npm run verify:runtime
          node --check public/sw.js
      - name: Verify exact-built public asset bytes against immutable deployed production paths
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const origin="https://thiepn.dev/clean30/";
          const files=["sw.js","manifest.webmanifest"];
          const hash=buf=>createHash('sha256').update(buf).digest('hex');
          for(const file of files){
            const build=await readFile('dist/'+file);
            const response=await fetch(new URL(file,origin),{cache:'no-store'});
            assert.equal(response.status,200,'Public '+file+' must be available');
            const production=Buffer.from(await response.arrayBuffer());
            assert.equal(hash(production),hash(build),file+' serving bytes differ from pinned source build');
            console.log('PASS exact public asset '+file,hash(build));
          }
          NODE
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run certify:rc1
      - name: Enforce dependency security gate after browser evidence
        if: always()
        run: test "\${{ steps.dependency_audit.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean30-source-rc1-phase3
          path: artifacts/rc1
          if-no-files-found: warn
          retention-days: 7

  tms60-pinned-recovery:
    name: TMS60 frozen production SHA local integrity, account isolation and PWA recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thiepn/tms60
          ref: 12343b974417c3ba23b64f592961c151e52f7ede
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce exact release source security and recovery
        run: |
          node --test tests/cloudflare-pages-migration.test.mjs
          node --test tests/cloudflare-pages-sw-recovery.test.mjs
          node tests/pwa-install-metadata-regression.mjs
          node tests/supabase-account-sync-regression.mjs
          node --test tests/supabase-account-sync-runtime.test.mjs
      - name: Build exact production source artifact without publishing
        run: |
          node scripts/build-cloudflare-pages.mjs
          (cd dist && sha256sum -c SHA256SUMS)
          node --test tests/cloudflare-pages-integrity.test.mjs
          node --test tests/cloudflare-pages-cutover-authority.test.mjs
          node --test tests/cloudflare-pages-preview-negative.test.mjs
      - name: Verify exact-built public asset bytes against immutable deployed production paths
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const origin="https://tms60.thiepn.dev/";
          const files=["sw.js","account-sync.js","manifest.webmanifest"];
          const hash=buf=>createHash('sha256').update(buf).digest('hex');
          for(const file of files){
            const build=await readFile('dist/'+file);
            const response=await fetch(new URL(file,origin),{cache:'no-store'});
            assert.equal(response.status,200,'Public '+file+' must be available');
            const production=Buffer.from(await response.arrayBuffer());
            assert.equal(hash(production),hash(build),file+' serving bytes differ from pinned source build');
            console.log('PASS exact public asset '+file,hash(build));
          }
          NODE
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Same-origin local PWA, offline and upgrade/rollback browser tests
        run: |
          node scripts/serve-cloudflare-pages-local.mjs >/tmp/tms60-phase3.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/cloudflare-pages-local-smoke.mjs
          node tests/cloudflare-pages-browser-transition.mjs

  recipe-pinned-auth-restore:
    name: Recipe frozen production SHA account and guarded restore tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thiepn/recipe
          ref: b9cf98453a017145d36c7d0ebb6c8b3054a8fd5b
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --no-frozen-lockfile
      - name: Reproduce core typed authorization, sync and restore paths
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/p2.test.ts tests/p14-local-signout.test.ts tests/p15-auth-startup.test.ts tests/p15b-sync-recovery.test.ts tests/p15d-recovery.test.ts tests/p15e-restore.test.ts
      - name: Confirm baseline complete suite without backend credentials
        run: pnpm test

  anonymous-production-journeys:
    name: Clean30 and TMS60 disposable browser recovery (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise disposable local-only workflows; remote non-GET requests blocked
        run: node tests/release-production-workflows.mjs

  recipe-pg17-jwt:
    name: Recipe original migrations, PostgreSQL 17 RLS and disposable signed JWT
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: release_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_audit"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
      PGDATABASE: release_audit
      RECIPE_TEST_JWT_SECRET: disposable-jwt-only-000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thiepn/recipe
          ref: b9cf98453a017145d36c7d0ebb6c8b3054a8fd5b
          path: recipe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert actual PostgreSQL major version and bootstrap disposable roles
        run: |
          psql -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num' | grep -E '^17[0-9]{4}$'
          psql -v ON_ERROR_STOP=1 -f hub/scripts/release/recipe-pg17-bootstrap.sql
      - name: Apply all seven pinned Recipe migrations; explicitly normalize known terminal typo in disposable copy
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find recipe/supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${#migrations[@]}" -eq 7
          for migration in "${migrations[@]}"; do
            echo "Applying original $(basename "$migration")"
            if [[ "$migration" == *20261006163029_recipe_p3_collection_lint_hardening.sql ]]; then
              node hub/scripts/release/recipe-normalize-terminal.mjs "$migration" /tmp/recipe-p3-terminator-normalized.sql
              psql -v ON_ERROR_STOP=1 -f /tmp/recipe-p3-terminator-normalized.sql >/dev/null
            else
              psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            fi
          done
          psql -v ON_ERROR_STOP=1 -f hub/scripts/release/recipe-pg17-assert.sql
      - name: Run disposable PostgREST with real signed JWT verification
        run: |
          docker run -d --name recipe-audit-postgrest --network host \
            -e PGRST_DB_URI=postgresql://authenticator:disposable-audit-only-password@127.0.0.1:5432/release_audit \
            -e PGRST_DB_SCHEMAS=audit,recipe,gateway \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$RECIPE_TEST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3039 \
            postgrest/postgrest:v12.2.12
          node hub/scripts/release/recipe-jwt-postgrest.mjs
      - name: Capture disposable server diagnostic only on failure
        if: failure()
        run: docker logs recipe-audit-postgrest 2>&1 | tail -60 || true

  clean30-dependency-remediation-rehearsal:
    name: Clean30 dependency fix rehearsal (ephemeral checkout, no owner write)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thiepn/clean30
          ref: 052731bd44f7e2113fd789be55dfb199d4f82fae
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Retain vulnerable baseline evidence without promotion
        run: |
          npm audit --json > /tmp/clean30-baseline-audit.json || true
          node -e "const a=require('/tmp/clean30-baseline-audit.json'); console.log('Baseline advisories:',JSON.stringify(a.metadata?.vulnerabilities))"
      - name: Attempt only compatible dependency lockfile remediation on disposable copy
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --no-audit --no-fund
          npm audit --audit-level=low
          git diff --exit-code -- package.json || { echo 'Package manifest changed unexpectedly'; exit 1; }
          node -e "const p=require('./package-lock.json').packages; console.log('Remediated pinned dependencies:',JSON.stringify({vite:p['node_modules/vite']?.version,sourceMapJs:p['node_modules/source-map-js']?.version}))"
          git diff --numstat -- package-lock.json
      - name: Qualify altered disposable dependencies without editing owner repository
        run: |
          npm test
          npm run build
          npm run verify:release
          npm run verify:runtime
          node --check public/sw.js

  tms60-pg17-signed-jwt:
    name: TMS60 original account-state/backup policies with actual disposable JWT ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: release_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_audit"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
      PGDATABASE: release_audit
      TMS60_TEST_JWT_SECRET: disposable-jwt-only-000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thiepn/tms60
          ref: 12343b974417c3ba23b64f592961c151e52f7ede
          path: tms60
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap only disposable Account prerequisites, verify PG17
        run: |
          psql -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num' | grep -E '^17[0-9]{4}$'
          psql -v ON_ERROR_STOP=1 -f hub/scripts/release/tms60-pg17-bootstrap.sql
      - name: Apply five pinned original TMS60 Account migrations and inspect owner policies
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find tms60/supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${#migrations[@]}" -eq 6
          for migration in "${migrations[@]:0:5}"; do
            echo "Applying original $(basename "$migration")"
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          test "${migrations[5]}" = "tms60/supabase/migrations/20261003221217_hub_h15_tms60_projection.sql"
          echo "NOT_TESTED: H15 projection requires upstream H12/H13 Account schema, not fabricated here"
          psql -v ON_ERROR_STOP=1 -f hub/scripts/release/tms60-pg17-assert.sql
      - name: Exercise signed JWT two-owner state/backups and identity-bound deletion over local PostgREST
        run: |
          docker run -d --name tms60-audit-postgrest --network host \
            -e PGRST_DB_URI=postgresql://authenticator:disposable-audit-only-password@127.0.0.1:5432/release_audit \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$TMS60_TEST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3039 \
            postgrest/postgrest:v12.2.12
          node hub/scripts/release/tms60-jwt-postgrest.mjs
      - if: failure()
        name: Print disposable PostgREST diagnostics only
        run: docker logs tms60-audit-postgrest 2>&1 | tail -80 || true
