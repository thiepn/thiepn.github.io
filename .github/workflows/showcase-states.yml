name: Showcase working states
on:
  push:
    branches: [design/showcase-tiny-tools]
    paths: ['.github/workflows/showcase-states.yml','scripts/capture-workflow-states.mjs']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/showcase-tiny-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-workflow-states.mjs
      - name: Preserve working states
        run: |
          cp workflow-state-evidence/results.json docs/showcase/workflow-provenance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/projects docs/showcase/workflow-provenance.json
          if ! git diff --cached --quiet; then git commit -m 'feat: demonstrate real publishing and typing workflows'; git push origin HEAD:design/showcase-tiny-tools; fi
          tar -czf workflow-state-evidence/assets.tar.gz public/projects docs/showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-working-states
          path: workflow-state-evidence/
          retention-days: 7
