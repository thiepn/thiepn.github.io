name: Capture project media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-project-media.mjs'
      - '.github/workflows/capture-project-media.yml'
      - 'src/content/projects/the-bible-challenge.md'
      - 'src/content/projects/pdf-studio.md'
      - 'src/content/projects/wordstrike.md'
      - 'src/content/projects/micro-arcade.md'
      - 'src/content/projects/voidcut.md'

permissions:
  contents: write

concurrency:
  group: capture-project-media
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture The Bible Challenge
        run: node scripts/capture-project-media.mjs the-bible-challenge https://thiepn.dev/tbc/

      - name: Capture PDF Studio
        run: node scripts/capture-project-media.mjs pdf-studio https://thiepn.dev/pdf/

      - name: Capture WORDSTRIKE
        run: node scripts/capture-project-media.mjs wordstrike https://thiepn.dev/wordstrike/

      - name: Capture Micro Arcade
        run: node scripts/capture-project-media.mjs micro-arcade https://thiepn.dev/arcade/

      - name: Capture VOIDCUT
        run: node scripts/capture-project-media.mjs voidcut https://thiepn.dev/voidcut/

      - name: Upload featured media review
        uses: actions/upload-artifact@v4
        with:
          name: featured-project-media-review
          path: |
            public/projects/the-bible-challenge/screenshot-desktop.png
            public/projects/the-bible-challenge/screenshot-mobile.png
            public/projects/pdf-studio/screenshot-desktop.png
            public/projects/pdf-studio/screenshot-workspace.png
            public/projects/wordstrike/screenshot-desktop.png
            public/projects/micro-arcade/screenshot-desktop.png
            public/projects/micro-arcade/screenshot-gameplay.png
            public/projects/voidcut/screenshot-desktop.png
            public/projects/voidcut/screenshot-gameplay.png
          if-no-files-found: error
          retention-days: 7

      - name: Refresh generated catalogue outputs
        run: npm run catalogue:refresh

      - name: Commit canonical media and generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/the-bible-challenge public/projects/pdf-studio public/projects/wordstrike public/projects/micro-arcade public/projects/voidcut src/generated
          if git diff --cached --quiet; then
            echo "Canonical media and generated outputs are unchanged."
            exit 0
          fi
          git commit -m "Refresh featured project media and catalogue"
          git pull --rebase origin main
          git push origin HEAD:main
