name: P6 diagnose artifact hash mismatch

on:
  push:
    branches:
      - vercel-p6-bootstrap-candidate
    paths:
      - .p6-hash-diagnose-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_CJcePUM0sptaE0SugAZYRy9JufRX
      VERCEL_ORG_ID: team_LVo30en2fIX29vZH3gnYxmoi
      DEPLOYMENT_URL: https://thiepn-hbd0hbqj7-thiepn-project.vercel.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7515633a2c3054c85f96aa80ee0264569e7b0c2b
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pull Production settings
        run: npx --yes vercel@50.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Production artifact
        run: npx --yes vercel@50.1.0 build --prod --token="$VERCEL_TOKEN"
      - name: Qualify artifact
        run: node --experimental-strip-types scripts/qualify-hub-release.mjs --dist .vercel/output/static
      - name: Create ephemeral bypass
        id: bypass
        run: npm run vercel:bypass-create
      - name: Compare exact bytes
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const report=JSON.parse(fs.readFileSync('.cache/hub-release-qualification.json','utf8'));
          const wanted=[
            report.builtAssets.find(x=>x.path==='/hub-release.json'),
            report.builtAssets.find(x=>x.path==='/'),
            report.builtAssets.find(x=>x.path.endsWith('.css')),
            report.builtAssets.find(x=>x.path.endsWith('.js')),
            report.builtAssets.find(x=>x.path.endsWith('.webp'))
          ].filter(Boolean);
          const base=process.env.DEPLOYMENT_URL,secret=process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          for(const a of wanted){
            const u=new URL(a.path,base);u.searchParams.set('hub-qualification','diagnose');
            const r=await fetch(u,{headers:{'x-vercel-protection-bypass':secret,'Cache-Control':'no-cache'},redirect:'manual',signal:AbortSignal.timeout(10000)});
            const b=Buffer.from(await r.arrayBuffer());
            const sha=crypto.createHash('sha256').update(b).digest('hex');
            console.log(JSON.stringify({path:a.path,status:r.status,location:r.headers.get('location'),contentType:r.headers.get('content-type'),contentEncoding:r.headers.get('content-encoding'),expectedBytes:a.bytes,actualBytes:b.length,sameBytes:b.length===a.bytes,sameSha:sha===a.sha256}));
          }
          NODE
      - name: Revoke ephemeral bypass
        if: ${{ always() && steps.bypass.outcome == 'success' }}
        run: npm run vercel:bypass-revoke
