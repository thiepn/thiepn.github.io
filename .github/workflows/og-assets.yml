name: Generate THIEPN social cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-og.mjs
      - scripts/rasterize-og.mjs
      - .github/workflows/og-assets.yml

permissions:
  contents: write

concurrency:
  group: thiepn-og-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate social-card derivatives
        run: node scripts/rasterize-og.mjs

      - name: Commit refreshed social-card derivatives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og/*.svg public/og/*.png src/generated/og-raster-manifest.json
          if git diff --cached --quiet; then
            echo "Social-card derivatives are already current."
            exit 0
          fi
          git commit -m "Refresh THIEPN social card derivatives"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
