name: Generate THIEPN social cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-generated-review.mjs'
      - scripts/generate-og.mjs
      - scripts/rasterize-og.mjs
      - .github/workflows/og-assets.yml

permissions:
  contents: read

concurrency:
  group: thiepn-og-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate social-card derivatives
        run: node scripts/rasterize-og.mjs

      - name: Package generated changes as an owner-reviewable binary patch
        run: node scripts/prepare-generated-review.mjs og-assets

      - name: Retain complete generated change patch and manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-og-assets
          path: .cache/generated-review/og-assets/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
