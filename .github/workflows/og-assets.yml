name: Generate THIEPN social cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-og.mjs
      - scripts/rasterize-og.mjs
      - .github/workflows/og-assets.yml

permissions:
  contents: read

concurrency:
  group: thiepn-og-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate social-card derivatives
        run: node scripts/rasterize-og.mjs

      - name: Prepare generated changes for PR review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- public/og src/generated/og-raster-manifest.json
          node scripts/export-generated-review.mjs

      - name: Upload generated review patch
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-og-assets
          path: ${{ runner.temp }}/generated-review/
          if-no-files-found: error
          retention-days: 14
