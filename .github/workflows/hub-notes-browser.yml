name: Hub managed Notes browsers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hub-managed-notes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-contract:
    name: Public contracts (private paired tests not executed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Account CI boundaries
        run: node --test tests/hub-account-ci-boundaries.test.mjs
      - name: Verify public integration contracts
        run: npx vitest run tests/unit/hub-notes-session.test.ts
      - name: Report private qualification status
        run: |
          echo "::notice title=Private paired qualification blocked::Private Account suites require an independently controlled runner. Public contracts do not qualify private integrations."
          echo "Private paired browser tests: NOT_EXECUTED (independent runner not configured)." >> "$GITHUB_STEP_SUMMARY"
  staged-paired:
    # Preserve the original pinned paired suite for migration to an independent
    # trusted control plane. It must not execute in public-repository CI.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable H14 Account authorization source
        uses: actions/checkout@v4
        with:
          repository: thiepn/account
          ref: c8fe0f99d5472b060022d4c8a68d5d94e21f389c
          path: .cache/h14-source-account
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
        working-directory: .cache/h14-source-account
      - name: Build isolated Account authorization fixture
        working-directory: .cache/h14-source-account
        run: pnpm exec vite build --outDir "${GITHUB_WORKSPACE}/.cache/h14-account"
        env:
          VITE_HUB_OAUTH_ENABLED: staged-v1
          VITE_HUB_OAUTH_CLIENT_ID: 33333333-3333-4333-8333-333333333333
          VITE_SUPABASE_URL: https://hycegznamzjhwinegaai.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_not_a_real_key
          VITE_ACCOUNT_CANONICAL_ORIGIN: https://account.thiepn.dev
      - name: Build isolated Hub fixture (never deploy these artifacts)
        run: npx astro build --outDir .cache/h14-hub
        env:
          PUBLIC_HUB_NOTES_PRIVATE: staged-v1
          PUBLIC_HUB_NOTES_CLIENT_ID: 33333333-3333-4333-8333-333333333333
          PUBLIC_HUB_PLATFORM_ORIGIN: https://platform-fictional.vercel.app
          PUBLIC_HUB_ACCOUNT_ENTRY: v1
          PUBLIC_HUB_AUTH_ORIGIN: https://thiepn.dev
          PUBLIC_THIEPN_SUPABASE_URL: https://hycegznamzjhwinegaai.supabase.co
          PUBLIC_THIEPN_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_not_a_real_key
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Actual Hub and Account connection in all engines
        run: npx playwright test -c playwright.hub-notes.config.ts
