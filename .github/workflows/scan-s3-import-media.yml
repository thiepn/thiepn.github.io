name: S3 Import Scan real media

on:
  push:
    branches: [scan-s3-real-media-download]
    paths:
      - '.github/workflows/scan-s3-import-media.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout S3 branch
        uses: actions/checkout@v7
        with:
          ref: scan-s3-real-media-download
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Download authentic Scan screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scan-source public/scan/screenshots

          download() {
            local branch="$1"
            local file="$2"
            local url="https://raw.githubusercontent.com/thiepn/scan/${branch}/visual-screenshots/${file}.png"
            echo "Fetching ${url}"
            curl --fail --location --silent --show-error \
              --retry 60 --retry-delay 10 --retry-all-errors \
              --output "/tmp/scan-source/${file}.png" "${url}"
          }

          for file in 01-library 02-scan-modes 03-sort-filter 04-automation-center 05-document-view 06-export-pdf; do
            download visual-capture-phase21 "${file}"
          done

          for file in 07-document-search 08-markup-redaction 09-form-filling; do
            download visual-capture-v1 "${file}"
          done

      - name: Verify and optimize screenshots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/scan-source')
          target = Path('public/scan/screenshots')
          target.mkdir(parents=True, exist_ok=True)

          expected = {
              '01-library': (1080, 2146),
              '02-scan-modes': (1080, 2146),
              '03-sort-filter': (1080, 2146),
              '04-automation-center': (1080, 2146),
              '05-document-view': (1080, 2146),
              '06-export-pdf': (1080, 2146),
              '07-document-search': (1080, 2400),
              '08-markup-redaction': (1080, 2400),
              '09-form-filling': (1080, 2400),
          }

          for stem, dimensions in expected.items():
              path = source / f'{stem}.png'
              if not path.is_file():
                  raise SystemExit(f'Missing authentic source screenshot: {path}')
              with Image.open(path) as image:
                  if image.size != dimensions:
                      raise SystemExit(f'{stem}: expected {dimensions}, got {image.size}')
                  rgb = image.convert('RGB')
                  out = target / f'{stem}.webp'
                  rgb.save(out, 'WEBP', quality=86, method=6)
                  if out.stat().st_size < 10000:
                      raise SystemExit(f'{stem}: optimized output is unexpectedly small')
                  print(f'{stem}: {image.size} -> {out.stat().st_size} bytes')
          PY

      - name: Commit S3 screenshot media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scan/screenshots
          if git diff --cached --quiet; then
            echo "S3 screenshot media is already current."
            exit 0
          fi
          git commit -m "S3: import authentic Scan Android screenshots"
          git pull --rebase origin scan-s3-real-media-download
          git push origin HEAD:scan-s3-real-media-download
